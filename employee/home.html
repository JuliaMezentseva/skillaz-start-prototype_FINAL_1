<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Главная — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, Tag } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, Icons } = window.Site;
const { IconAiSpark, IconSearch, IconCheck, IconChevronRight, IconGift, IconRocket, IconLayers, IconBookOpen, IconGraduationCap } = Icons;
const D = window.SITE_DATA;

// Переключатель модулей ("Все / Адаптация / Обучение / Оценка / ИПР / Вакансии") — идея
// из референса AI-ассистента, но здесь это просто фильтр того, что показывают блоки "Что
// сейчас важно" и "Быстрые действия с AI" ниже. "Оценка" и "ИПР" в этом прототипе не
// реализованы как отдельные разделы (нет своих данных/страниц), поэтому у них честная
// заглушка "скоро", а не выдуманный контент, ведущий в никуда.
const MODULES = [
  { id: "all", label: "Всё" },
  { id: "adaptation", label: "Адаптация" },
  { id: "learning", label: "Обучение" },
  { id: "assessment", label: "Оценка" },
  { id: "idp", label: "ИПР" },
  { id: "vacancies", label: "Вакансии" },
];
// Подсказки для блока "Быстрые действия с AI", свои на каждый модуль — про то же самое,
// что резолвер в shell.js реально понимает (aiEmployeeHomeIntent), поэтому клиент на демо
// всегда получает содержательный ответ, а не "не нашёл сценария". У "Оценка"/"ИПР"
// подсказок нет намеренно.
const MODULE_PROMPTS = {
  all: ["Что мне сделать сегодня?", "Подготовиться к контрольной точке", "Какие вакансии мне подходят?"],
  adaptation: ["Что мне сделать сегодня?", "Подготовиться к контрольной точке", "Что у меня в работе?"],
  learning: ["Какие курсы у меня есть?"],
  assessment: [],
  idp: [],
  vacancies: ["Какие вакансии мне подходят?"],
};

// Локальные копии части логики виджета AI из shell.js (aiEmployeePlanUpcomingCheckpoint /
// aiEmployeePlanActiveSubgoals / aiEmployeePlanUrgentChecklist / aiStripDuePrefix /
// aiVacancyMatchScore) — та логика приватна для резолвера чата и не экспортирована наружу,
// а тут она нужна ещё раз, чтобы блоки на самой странице показывали те же реальные данные,
// что и ответы AI в чате. Если модель данных плана/вакансий изменится — поправить в обоих местах.
function upcomingCheckpoint(plan) {
  const cps = Object.values(plan.checkpoints || {});
  return cps.find((c) => c.status !== "done") || null;
}
function activeSubgoals(plan) {
  return (plan.goals || []).flatMap((g) => (g.subgoals || [])
    .filter((sg) => sg.status === "in_progress" || sg.status === "returned")
    .map((sg) => ({ ...sg, goalId: g.id, goalTitle: g.title })));
}
function urgentChecklist(plan) {
  return plan.stages.flatMap((s) => s.items.filter((i) => i.kind !== "checkpoint" && !i.done && i.highlight === "warning"));
}
function stripDuePrefix(label) {
  return (label || "").replace(/^до\s+/i, "");
}
function vacancyMatchScore(v, person) {
  let score = 40;
  if (v.department === person.department) score += 25;
  if (v.city === person.city || v.format === "Удалённо") score += 15;
  const tenureMonths = parseInt(person.tenure, 10) || 0;
  if (tenureMonths < 12) {
    if (v.experience === "Без опыта" || v.experience === "От 1 года") score += 15;
    else if (v.experience === "От 5 лет") score -= 15;
    else score += 5;
  } else score += 10;
  return Math.max(30, Math.min(96, score));
}
function topVacancyMatches(n) {
  const pool = D.vacancies.filter((v) => v.visibleToEmployees !== false && v.status === "open");
  return pool.map((v) => ({ v, pct: vacancyMatchScore(v, D.person) }))
    .sort((a, b) => b.pct - a.pct).slice(0, n);
}

function askAi(query) {
  if (window.__skAiOpenAssistant) window.__skAiOpenAssistant(query);
}

// Визуально главный блок страницы: только бренд + поиск (тот же градиент special→accent,
// что и у плавающей кнопки AI-ассистента в углу — переиспользуем уже существующий "цвет AI"
// в этом прототипе, а не придумываем новый). Переключатель модулей и быстрые вопросы живут
// отдельно, ниже (см. ModuleTabs/ActionsCard) — так они визуально ближе к блоку, которым
// управляют, а не спрятаны внутри градиента далеко от него.
function AiHero() {
  const [value, setValue] = React.useState("");
  function submit() {
    if (!value.trim()) return;
    askAi(value);
    setValue("");
  }
  return (
    <div style={{
      borderRadius: "var(--sk-radius-5)", padding: 28,
      background: "linear-gradient(135deg, var(--sk-special), var(--sk-accent))",
      boxShadow: "var(--sk-shadow-m)", display: "flex", flexDirection: "column", gap: 18,
    }}>
      <div className="sk-row sk-gap-3" style={{ alignItems: "center" }}>
        <span style={{
          width: 44, height: 44, borderRadius: "50%", flexShrink: 0,
          background: "rgba(255,255,255,0.18)", display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <IconAiSpark size={22} color="#FFC804" />
        </span>
        <div style={{ minWidth: 0 }}>
          <div style={{ font: "var(--sk-title-5)", color: "#fff" }}>Чем помочь сегодня?</div>
          <div style={{ font: "var(--sk-label-3-regular)", color: "rgba(255,255,255,0.76)", marginTop: 2 }}>
            Открою нужный объект, подскажу или выполню действия за вас — скажите, что нужно
          </div>
        </div>
      </div>

      <div className="sk-row sk-gap-2">
        <div style={{
          flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 10, height: 48,
          padding: "0 16px", borderRadius: "var(--sk-radius-3)", background: "rgba(255,255,255,0.16)",
        }}>
          <IconSearch size={18} color="rgba(255,255,255,0.7)" />
          <input value={value} onChange={(e) => setValue(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
            placeholder="Например: что мне важно успеть сегодня?"
            style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", color: "#fff", font: "400 15px/22px var(--sk-font-ui)" }} />
        </div>
        <button onClick={submit} disabled={!value.trim()} style={{
          height: 48, padding: "0 22px", borderRadius: "var(--sk-radius-3)", border: "none", flexShrink: 0,
          background: value.trim() ? "#fff" : "rgba(255,255,255,0.3)",
          color: value.trim() ? "#171a20" : "rgba(255,255,255,0.65)",
          font: "var(--sk-label-3)", cursor: value.trim() ? "pointer" : "default",
        }}>Спросить</button>
      </div>
    </div>
  );
}

// Переключатель модулей — прямо над блоком, который он фильтрует, без своей рамки: активный
// таб получает акцентную заливку, неактивный — обычный текст с лёгкой подсветкой по ховеру.
function ModuleTabs({ active, onChange }) {
  return (
    <div className="sk-row sk-gap-1" style={{ flexWrap: "wrap" }}>
      {MODULES.map((m) => {
        const sel = m.id === active;
        return (
          <button key={m.id} onClick={() => onChange(m.id)} className={sel ? "" : "sk-clickable"} style={{
            border: "none", cursor: "pointer", borderRadius: "var(--sk-radius-full)", padding: "8px 16px",
            font: sel ? "var(--sk-label-3)" : "var(--sk-label-3-regular)",
            background: sel ? "var(--sk-accent-secondary)" : "transparent",
            color: sel ? "var(--sk-text-accent)" : "var(--sk-text-secondary)",
          }}>{m.label}</button>
        );
      })}
    </div>
  );
}

function FocusRow({ kind, title, subtitle, tone, href, first }) {
  return (
    <a href={href} className="sk-clickable" style={{
      display: "grid", gridTemplateColumns: "84px minmax(0,1fr) 18px", gap: 12, alignItems: "center",
      padding: "12px 4px", borderTop: first ? "none" : "1px solid var(--sk-stroke-divider)", textDecoration: "none",
    }}>
      <span style={{ font: "var(--sk-label-4-regular)", color: tone === "warn" ? "var(--sk-text-negative)" : "var(--sk-text-secondary)" }}>{kind}</span>
      <span style={{ minWidth: 0 }}>
        <span className="sk-label-3" style={{ display: "block", color: "var(--sk-text-primary)" }}>{title}</span>
        <span className="sk-muted" style={{ display: "block", font: "var(--sk-label-4-regular)", marginTop: 2 }}>{subtitle}</span>
      </span>
      <IconChevronRight size={16} color="var(--sk-icon-accent)" />
    </a>
  );
}

function FocusCard({ rows, emptyText }) {
  return (
    <Card bordered style={{ padding: 20 }}>
      <div className="sk-row sk-gap-2" style={{ justifyContent: "space-between", marginBottom: 10 }}>
        <div className="sk-label-2">Что сейчас важно</div>
        <Tag size="s" hue="special" icon={<IconAiSpark size={11} />}>AI</Tag>
      </div>
      {rows.length
        ? <div>{rows.map((r, i) => <FocusRow key={i} first={i === 0} {...r} />)}</div>
        : <div className="sk-muted" style={{ font: "var(--sk-label-3-regular)", padding: "6px 2px" }}>{emptyText}</div>}
    </Card>
  );
}

function ActionRow({ title, onClick, first }) {
  return (
    <button onClick={onClick} className="sk-clickable" style={{
      display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left",
      border: "none", background: "transparent", padding: "11px 4px", cursor: "pointer",
      borderTop: first ? "none" : "1px solid var(--sk-stroke-divider)",
    }}>
      <span style={{
        width: 26, height: 26, borderRadius: "50%", flexShrink: 0,
        background: "var(--sk-special-secondary)", display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <IconAiSpark size={13} color="var(--sk-icon-special)" />
      </span>
      <span className="sk-label-3" style={{ flex: 1, minWidth: 0, color: "var(--sk-text-primary)" }}>{title}</span>
      <IconChevronRight size={14} color="var(--sk-icon-accent)" />
    </button>
  );
}

function ActionsCard({ prompts }) {
  return (
    <Card bordered style={{ padding: 20 }}>
      <div className="sk-label-2" style={{ marginBottom: 6 }}>Быстрые действия с AI</div>
      {prompts.length
        ? <div>{prompts.map((p, i) => <ActionRow key={p} first={i === 0} title={p} onClick={() => askAi(p)} />)}</div>
        : <div className="sk-muted" style={{ font: "var(--sk-label-3-regular)", padding: "6px 2px" }}>Пока нет готовых подсказок для этого раздела.</div>}
    </Card>
  );
}

function ComingSoonPanel({ label }) {
  return (
    <Card bordered style={{ padding: 20 }}>
      <div className="sk-row sk-gap-2" style={{ alignItems: "center", marginBottom: 6 }}>
        <Tag size="s" hue="neutral">Скоро</Tag>
        <div className="sk-label-2">{label}</div>
      </div>
      <div className="sk-muted" style={{ font: "var(--sk-label-3-regular)" }}>
        Раздел ещё не подключён к Skillaz Start — здесь появится сводка и быстрые действия AI, когда модуль будет готов.
      </div>
    </Card>
  );
}

// Цветные заглушки-иллюстрации для карточек обучения вместо фото — сплошная заливка
// фирменными акцентными цветами (см. присланную палитру) плюс белая иконка по центру.
const COURSE_TILES = [
  { bg: "#FF79D5", Icon: IconBookOpen },
  { bg: "#38C0FF", Icon: IconGraduationCap },
  { bg: "#49DE4E", Icon: IconRocket },
];

function CourseCard({ title, state, progressPct, meta, href, tile }) {
  const Icon = tile.Icon;
  return (
    <a href={href} style={{ textDecoration: "none" }}>
      <Card bordered padding={0} className="sk-clickable" style={{ overflow: "hidden", display: "flex", flexDirection: "column", height: "100%" }}>
        <div style={{ height: 104, background: tile.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon size={34} color="#fff" />
        </div>
        <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10, flex: 1 }}>
          <div className="sk-row sk-gap-2" style={{ justifyContent: "space-between" }}>
            <Tag size="s" hue="neutral">Адаптация</Tag>
            {state === "done"
              ? <Tag size="s" hue="positive" icon={<IconCheck size={11} />}>Завершён</Tag>
              : <Tag size="s" hue="neutral">Скоро</Tag>}
          </div>
          <div className="sk-label-2" style={{ color: "var(--sk-text-primary)" }}>{title}</div>
          <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{meta}</div>
          <div style={{ marginTop: "auto" }}>
            <div style={{ height: 5, borderRadius: 4, background: "var(--sk-surface-secondary)", overflow: "hidden" }}>
              <div style={{ width: progressPct + "%", height: "100%", background: state === "done" ? "var(--sk-positive)" : "var(--sk-accent)" }} />
            </div>
            <div className="sk-row" style={{ justifyContent: "space-between", marginTop: 6 }}>
              <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>{progressPct}%</span>
              <span style={{ font: "var(--sk-label-4)", color: state === "done" ? "var(--sk-text-secondary)" : "var(--sk-text-accent)" }}>{state === "done" ? "Продолжить" : "Подробнее"} →</span>
            </div>
          </div>
        </div>
      </Card>
    </a>
  );
}

function NewsCard({ label, title, date, icon }) {
  return (
    <Card bordered style={{ padding: 16, display: "flex", gap: 12, alignItems: "flex-start" }}>
      <span style={{
        width: 40, height: 40, borderRadius: "var(--sk-radius-3)", flexShrink: 0,
        background: "var(--sk-surface-secondary)", color: "var(--sk-icon-secondary)",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>{icon}</span>
      <div style={{ minWidth: 0 }}>
        <Tag size="s" hue="neutral">{label}</Tag>
        <div className="sk-label-3" style={{ marginTop: 6 }}>{title}</div>
        <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)", marginTop: 6 }}>{date}</div>
      </div>
    </Card>
  );
}

// Курсы — это курсы из своего же плана адаптации (kind:"course" в stages), показанные
// в виде плиток "как в LMS": отдельного каталога обучения в прототипе пока нет, поэтому
// у всех карточек одна и та же ссылка — назад на employee/plan.html, где эти курсы и живут.
function planCourses(plan) {
  return plan.stages.flatMap((s) => s.items.filter((i) => i.kind === "course")).map((c) => ({
    id: c.id, title: c.title,
    state: c.done ? "done" : "upcoming",
    progressPct: c.done ? 100 : 0,
    meta: c.done ? "Пройден" : (c.date ? "Начнётся " + c.date : "Ещё не начат"),
  }));
}

const NEWS = [
  { label: "Компания", title: "Обновили регламент по бенефитам: что изменилось", date: "18 августа", icon: <IconGift size={18} /> },
  { label: "Адаптация", title: "Как проходит контрольная точка с руководителем", date: "12 августа", icon: <IconRocket size={18} /> },
  { label: "Продукт", title: "Новая версия CRM: что важно знать менеджерам", date: "5 августа", icon: <IconLayers size={18} /> },
];

function Page() {
  const [activeModule, setActiveModule] = React.useState("all");
  const plan = D.plans.onboarding;
  const planHref = "plan.html?plan=" + plan.id;

  const cp = upcomingCheckpoint(plan);
  const subgoals = activeSubgoals(plan);
  const urgent = urgentChecklist(plan);
  const courses = planCourses(plan);
  const vacancyMatches = topVacancyMatches(2);

  const adaptationRows = [];
  urgent.forEach((it) => adaptationRows.push({ kind: "Шаг", title: it.title, subtitle: it.date ? "Срок " + it.date : "Требует внимания", tone: "warn", href: planHref }));
  subgoals.forEach((sg) => adaptationRows.push({ kind: "Цель", title: sg.title, subtitle: sg.goalTitle + " · " + stripDuePrefix(sg.dueLabel), tone: "", href: planHref }));
  if (cp) adaptationRows.push({ kind: "Точка", title: cp.title, subtitle: (cp.daysLeftLabel ? cp.daysLeftLabel + " · " : "") + cp.dueLabel, tone: "", href: planHref });

  const learningRows = courses.filter((c) => c.state !== "done")
    .map((c) => ({ kind: "Курс", title: c.title, subtitle: c.meta, tone: "", href: planHref }));

  const vacancyRows = vacancyMatches.map(({ v, pct }) => ({
    kind: "Вакансия", title: v.title, subtitle: v.city + " · подходит на " + pct + "%", tone: "", href: "vacancy.html?id=" + v.id,
  }));

  const MODULE_CONTENT = {
    all: { rows: [...adaptationRows.slice(0, 2), ...vacancyRows.slice(0, 1)], emptyText: "Срочных задач сейчас нет — можно спокойно двигаться в своём темпе." },
    adaptation: { rows: adaptationRows, emptyText: "Срочных задач по плану адаптации сейчас нет." },
    learning: { rows: learningRows, emptyText: "Все курсы по плану адаптации уже пройдены." },
    vacancies: { rows: vacancyRows, emptyText: "Подходящих открытых вакансий сейчас нет." },
    assessment: { comingSoon: true },
    idp: { comingSoon: true },
  };
  const content = MODULE_CONTENT[activeModule];
  const moduleLabel = MODULES.find((m) => m.id === activeModule).label;
  const prompts = MODULE_PROMPTS[activeModule] || [];

  return (
    <AppShell role="employee" active="home" base="..">
      <div className="sk-col sk-gap-6">
        <div className="sk-title-4">Добрый день, {D.person.firstName}!</div>

        <AiHero />

        <ModuleTabs active={activeModule} onChange={setActiveModule} />

        {content.comingSoon ? (
          <ComingSoonPanel label={moduleLabel} />
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1.6fr) minmax(280px,1fr)", gap: 16 }}>
            <FocusCard rows={content.rows} emptyText={content.emptyText} />
            <ActionsCard prompts={prompts} />
          </div>
        )}

        <div className="sk-col sk-gap-3">
          <div className="sk-row" style={{ justifyContent: "space-between" }}>
            <div className="sk-title-5">Продолжить обучение</div>
            <a href={planHref} style={{ font: "var(--sk-label-3)", color: "var(--sk-text-accent)" }}>Открыть план →</a>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 14 }}>
            {courses.map((c, i) => <CourseCard key={c.id} {...c} tile={COURSE_TILES[i % COURSE_TILES.length]} href={planHref} />)}
          </div>
        </div>

        <div className="sk-col sk-gap-3">
          <div className="sk-title-5">Новости</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 14 }}>
            {NEWS.map((n, i) => <NewsCard key={i} {...n} />)}
          </div>
        </div>
      </div>
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
