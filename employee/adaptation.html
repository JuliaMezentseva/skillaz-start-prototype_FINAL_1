<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Моя адаптация — Skillaz Start</title>
<link rel="stylesheet" href="../assets/styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../assets/ds_bundle.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/cover-art.js"></script>
<script type="text/babel" src="../assets/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, ProgressCircle, Tag } = window.SkillazCoreDesignSystem_bf9566;
const { AppShell, StatusTag, Icons } = window.Site;
const { IconTarget, IconCheck } = Icons;
const D = window.SITE_DATA;
const { FRAME, RIBBONS, ICONS } = window.CoverArt;

// band — область исходной обложки [x0, y0, x1, y1], которую показываем в баннере.
// Правый край подрезан, чтобы в кадр не попадали круглые «шапки» исходных фигур:
// растянутые на узкую полосу они читаются как случайные полукруги.
const BANNER_THEME = {
  yellow: { bg: "#FDE284", light: "#FFF3C7", accent: "#FFC804", ribbon: "yellow", icon: "star", band: [0, 282, 1500, 582] },
  blue:   { bg: "#98DEFF", light: "#DEF4FF", accent: "#38C0FF", ribbon: "blue",   icon: "hand", band: [0, 282, 1800, 582] },
  green:  { bg: "#8FFF92", light: "#D9FFDB", accent: "#49DE4E", ribbon: "green",  icon: "star", band: [0, 282, 1800, 582] },
  // Розовая карточка намеренно берёт форму голубой обложки — у розового оригинала
  // зигзаг другой, а в наборе карточек они должны читаться одинаково.
  pink:   { bg: "#FFB7E8", light: "#FFE9F8", accent: "#FF79D5", ribbon: "blue",   icon: "star", band: [0, 282, 1800, 582] },
};
const BANNER_HUE = { completed: "pink", in_progress_plan: "blue", awaiting_start: "yellow" };

function TracedShape({ shape, fill }) {
  return (
    <g transform={`translate(${shape.tx},${shape.ty}) scale(${shape.sx},${shape.sy})`}>
      <path d={shape.d} fill={fill} />
    </g>
  );
}

function PlanBanner({ hue, height = 72 }) {
  const t = BANNER_THEME[hue] || BANNER_THEME.blue;
  const ribbon = RIBBONS[t.ribbon];
  const icon = ICONS[t.icon];
  const [bx0, by0, bx1, by1] = t.band;
  const iconH = Math.round(height * 0.56);
  const iconW = Math.round(iconH * (icon.w / icon.h));
  return (
    <div style={{ position: "relative", height, background: t.bg, overflow: "hidden" }}>
      <svg viewBox={`${bx0} ${by0} ${bx1 - bx0} ${by1 - by0}`} preserveAspectRatio="none"
           style={{ position: "absolute", inset: 0, width: "100%", height: "100%", display: "block" }}>
        <TracedShape shape={ribbon} fill={t.light} />
      </svg>
      <svg viewBox={`0 0 ${icon.w} ${icon.h}`} width={iconW} height={iconH}
           style={{ position: "absolute", right: Math.round(height * 0.7), top: (height - iconH) / 2 }}>
        <TracedShape shape={icon} fill={t.accent} />
      </svg>
    </div>
  );
}

function progressOf(plan) {
  if (!plan.hasGoals) {
    const all = plan.stages.flatMap(s => s.items.filter(i => i.kind !== "checkpoint"));
    const done = all.filter(i => i.done).length;
    return all.length ? Math.round((done / all.length) * 100) : 0;
  }
  const goalsDone = plan.goals.filter(g => g.subgoals.length && g.subgoals.every(s => s.status === "done")).length;
  return plan.goals.length ? Math.round((goalsDone / plan.goals.length) * 100) : 0;
}

function PlanCard({ plan, clickable = true }) {
  const pending = plan.status === "awaiting_start";
  const pct = plan.status === "completed" ? 100 : (plan.stages ? progressOf(plan) : 0);
  const checkpoints = Object.values(plan.checkpoints || {});
  const statusKey = plan.status === "completed" ? "completed" : pending ? "awaiting_start" : "in_progress_plan";
  // План ещё не сформирован — приглушаем содержимое, но не статус-тег: он как раз
  // объясняет, почему карточка выглядит неактивной.
  const fade = pending ? { opacity: 0.55 } : undefined;
  const body = (
    <Card bordered padding={0} style={{ cursor: clickable ? "pointer" : "default", overflow: "hidden" }}>
      <PlanBanner hue={BANNER_HUE[statusKey]} />
      <div className="sk-row sk-gap-4" style={{ justifyContent: "space-between", padding: 24 }}>
        <div className="sk-col sk-gap-2" style={{ flex: 1 }}>
          <div className="sk-row sk-gap-2">
            <Tag size="s" hue="neutral">{plan.type}</Tag>
            <StatusTag status={statusKey} />
          </div>
          <div className="sk-title-5" style={fade}>{plan.title}</div>
          {!pending && (
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>
              {plan.dateEnd ? `${plan.dateStart} – ${plan.dateEnd}` : `с ${plan.dateStart}`}
            </div>
          )}
          {checkpoints.length > 0 && (
            <div className="sk-row sk-gap-2" style={{ marginTop: 2 }}>
              <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>Контрольные точки:</span>
              <div className="sk-row sk-gap-1">
                {checkpoints.map(cp => (
                  <span key={cp.id} title={cp.short} style={{
                    width: 18, height: 18, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                    background: cp.status === "done" ? "var(--sk-positive)" : "var(--sk-surface-secondary)",
                    color: cp.status === "done" ? "var(--sk-text-contrast)" : "var(--sk-icon-secondary)",
                  }}>
                    {cp.status === "done" ? <IconCheck size={10} /> : <IconTarget size={10} />}
                  </span>
                ))}
              </div>
            </div>
          )}
        </div>
        {pending ? (
          <div style={{ textAlign: "center", flexShrink: 0, ...fade }}>
            <div className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>старт</div>
            <div className="sk-title-5">{plan.dateStart.slice(0, 5)}</div>
          </div>
        ) : (
          <ProgressCircle value={pct} size={72} thickness={5} hue={plan.status === "completed" ? "positive" : "accent"} />
        )}
      </div>
    </Card>
  );
  return clickable
    ? <a href={"plan.html?plan=" + plan.id} style={{ textDecoration: "none" }}>{body}</a>
    : body;
}

function RoleGroup({ title, period, children }) {
  return (
    <div className="sk-col sk-gap-2">
      <div className="sk-row sk-gap-2" style={{ alignItems: "baseline", paddingLeft: 2 }}>
        <span className="sk-label-3">{title}</span>
        {period && <span className="sk-muted" style={{ font: "var(--sk-label-4-regular)" }}>· {period}</span>}
      </div>
      <div className="sk-col sk-gap-4" style={{ maxWidth: 880 }}>{children}</div>
    </div>
  );
}

function Page() {
  const currentRolePlans = [D.plans.onboarding, D.plans.preboarding]
    .sort((a, b) => (a.status === "completed") - (b.status === "completed"));
  const newRolePlan = D.plans.roleTransition;
  return (
    <AppShell role="employee" active="my-adaptation" base="..">
      <div className="sk-col sk-gap-2">
        <div className="sk-title-4">Моя адаптация</div>
      </div>

      {newRolePlan && (
        <RoleGroup title={newRolePlan.role}>
          <PlanCard plan={newRolePlan} clickable={false} />
        </RoleGroup>
      )}

      <RoleGroup title="Менеджер по продажам">
        {currentRolePlans.map(p => <PlanCard key={p.id} plan={p} />)}
      </RoleGroup>
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
