  const sc = scaleById(c.scale), val = s.answers[c.id], com = (s.comments || {})[c.id] || '';
  const showCom = c.comment !== 'hidden' && (c.comment === 'required' || !!com || !!(S.fillOpen && S.fillOpen[c.id]));
  const need = c.comment === 'required' && val != null && !com.trim();
  const file = (s.files || {})[c.id];
  const extras = [];
  if (c.comment !== 'hidden' && !showCom) extras.push(`<button class="btn b-atert xs" type="button" data-act="show-comment" data-id="${c.id}">+ Комментарий</button>`);
  if (c.attach) extras.push(file
    ? `<span class="tg tg-pos">Файл прикреплён</span><button class="btn b-atert xs" type="button" data-act="attach" data-id="${c.id}">Убрать</button>`
    : `<button class="btn b-gray2 xs" type="button" data-act="attach" data-id="${c.id}">+ Фото или файл</button>`);
  return `<div class="fc" id="fc-${c.id}">
    <div class="row top" style="gap:12px">
      <span class="rg3 m2 fc-no">${bi+1}.${ci+1}</span>
      <div style="flex:1;min-width:0"><div class="fc-t">${esc(c.text)}${c.critical ? ' ' + tag('tg-neg','критичный') : ''}</div>${c.hint ? `<p class="rg4 m2" style="margin-top:4px">${esc(c.hint)}</p>` : ''}</div>
    </div>
    <div class="fc-opts" role="radiogroup" aria-label="Оценка критерия ${bi+1}.${ci+1}">${sc.values.map((v, vi) => `<button class="opt-row ${val===vi?'on':''}" type="button" role="radio" aria-checked="${val===vi}" data-ans="${c.id}" data-vi="${vi}"><span class="rd" aria-hidden="true"></span><span>${esc(v.label)}</span></button>`).join('')}${extras.join('')}</div>
    ${showCom ? `<div class="fc-x"><input class="in" placeholder="${c.comment==='required' ? 'Комментарий обязателен' : 'Комментарий'}" value="${esc(com)}" data-comment="${c.id}" aria-label="Комментарий к критерию ${bi+1}.${ci+1}" ${need ? 'aria-invalid="true"' : ''}></div>` : ''}
  </div>`;
}

/* Итог в заполнении — только если лист настроен «решение оценивающего»: баллы для справки, а пройден лист или нет выбирает тот, кто оценивает */
function fillDecision(s, t, res) {
  const set = VERDICT_SETS[sessionConsequence(s)] || VERDICT_SETS.dev;
  return `<section class="cd" id="fill-decision"><div class="cd-h"><div class="tx"><h3 class="t5">Итог</h3><p>Результат по баллам — ${res.pct != null ? res.pct + '%' : 'пока не посчитан'}, он для справки. Пройден ли лист, решаете вы.</p></div></div>
    <div class="col" style="gap:8px" role="radiogroup" aria-label="Итог сессии">${[['pass', set.pass], ['fail', set.fail]].map(([v, l]) => `<button class="opt-row ${s.decision === v ? 'on' : ''}" type="button" role="radio" aria-checked="${s.decision === v}" data-act="decide" data-v="${v}"><span class="rd" aria-hidden="true"></span><span>${esc(l)}</span></button>`).join('')}</div></section>`;
}

function viewFill() {
  const s = SESSIONS.find(x => x.id === S.arg) || SESSIONS[2];
  const t = tplById(s.tpl), subj = subjectOf(s), res = calcResult(s);
  const pct = res.total ? Math.round(res.answered / res.total * 100) : 0;
  const gen = t.general.filter(g => (g.label || '').trim());
  const body = t.blocks.map((b, bi) => {
    const d = b.criteria.filter(c => s.answers[c.id] != null).length;
    return `<section class="cd" id="fill-${b.id}">
      <div class="cd-h"><div class="tx"><h3 class="t5">${bi+1}. ${esc(b.name)}</h3>${blockByNames(s).length ? `<p class="rg4 m2">Оценивает: ${esc(blockByOf(s)[b.id] || s.by)}</p>` : ''}</div><span class="rg4 m2 nowrap">${d} из ${b.criteria.length}</span></div>
      <div class="col4">${b.criteria.map((c, ci) => fillCriterion(s, c, bi, ci)).join('')}</div>
    </section>`;
  }).join('');
  const buttons = `<button class="btn b-ghost" type="button" data-act="later" data-id="${s.id}">Продолжить позже</button>
    <button class="btn b-neutral" type="button" data-act="finish" data-id="${s.id}">Завершить сессию</button>`;

  return page({
    crumbs: crumb([{label:'Сессии', go:'sessions'},{label:subj.name}]),
    title:'Заполнение сессии',
    sub:`${esc(t.name)} · ${esc(subj.name)}, ${esc(subj.unit)}`,
    actions: buttons,
    body:`<div class="fill-grid">
      <div class="col4">
        <div class="cd p16 fill-prog"><div class="row" style="gap:16px"><b class="sub1 nowrap">${res.answered} из ${res.total}</b>${pbar(pct)}<span class="rg4 m2 nowrap fill-auto">Сохраняется автоматически</span></div></div>
        ${gen.length ? `<section class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">Общая информация</h3></div></div>
          <div class="g2">${gen.map(g=>`<div class="fl"><label>${esc(g.label)}${g.required?' <span class="req">*</span>':''}</label>${g.type==='dict'?`<select class="sl" data-general="${esc(g.label)}">${opt('', g.hint || 'Выберите значение', s.general[g.label] || '')}${dictValues(g.dict).map(v => opt(v, v, s.general[g.label] || '')).join('')}</select>`:g.type==='long'?`<textarea class="ta" placeholder="${esc(g.hint)}" data-general="${esc(g.label)}">${esc(s.general[g.label]||'')}</textarea>`:`<input class="in" value="${esc(s.general[g.label]||'')}" placeholder="${esc(g.hint)}" data-general="${esc(g.label)}">`}</div>`).join('')}</div></section>` : ''}
        ${body}
        <section class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">Обратная связь</h3></div></div>
          <div class="col4">${t.feedback.map(f=>{ const v = s.feedback[f.label]; return f.structured
            ? `<div class="fl"><label>${esc(f.label)}${f.required?' <span class="req">*</span>':''}</label><div class="col" style="gap:8px"><input class="in" placeholder="70 — что отработать в реальной работе" value="${esc((Array.isArray(v)&&v[0])||'')}" data-feedback="${esc(f.label)}" data-feedback-part="0"><input class="in" placeholder="20 — что разобрать с наставником" value="${esc((Array.isArray(v)&&v[1])||'')}" data-feedback="${esc(f.label)}" data-feedback-part="1"><input class="in" placeholder="10 — какое обучение пройти" value="${esc((Array.isArray(v)&&v[2])||'')}" data-feedback="${esc(f.label)}" data-feedback-part="2"></div></div>`
            : `<div class="fl"><label>${esc(f.label)}${f.required?' <span class="req">*</span>':''}</label><textarea class="ta" data-feedback="${esc(f.label)}">${esc((!Array.isArray(v)&&v)||'')}</textarea></div>`; }).join('')}</div>
        </section>
        ${t.verdictMode === 'manual' ? fillDecision(s, t, res) : ''}
      </div>
      <aside class="cd p16 fill-side">
        <b class="sub2" style="display:block;margin-bottom:10px">Блоки</b>
        <div class="col" style="gap:2px">${t.blocks.map((b,bi)=>{ const d=b.criteria.filter(c=>s.answers[c.id]!=null).length; return `<a class="nav-i" href="#fill-${b.id}" data-jump="fill-${b.id}" style="height:36px"><span class="rg4 m3" style="min-width:18px">${bi+1}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 13px/18px var(--font)">${esc(b.name)}</span><span class="rg4 ${d===b.criteria.length?'':'m3'}" style="${d===b.criteria.length?'color:var(--pos-text)':''}">${d}/${b.criteria.length}</span></a>`;}).join('')}</div>
      </aside>
    </div>
    <div class="fill-bar">${buttons}</div>` });
}


</script>
<script>
'use strict';
/* ═══════════════ ШАБЛОНЫ ЛИСТОВ ═══════════════ */
function tplMatches(t) {
  const f = S.templates;
  if (t.status !== (f.tab === 'draft' ? 'draft' : f.tab === 'archived' ? 'archived' : 'published')) return false;
  const si = stdInfo(t.std);
  if (f.dir && !(si && si.group === f.dir)) return false;
  if (f.profile) { const pr = tplProfiles(t); if (pr.length && !pr.includes(f.profile)) return false; }
  /* основная ось подбора — сама работа: название и компетенция, которую проверяет лист */
  if (f.q) { const hay = [t.name, t.purpose, ...tplProfiles(t), si ? si.name + ' ' + si.group : ''].join(' ').toLowerCase(); if (!hay.includes(f.q.toLowerCase())) return false; }
  return true;
}
const rulesFor = (tplId) => RULES.filter(r => r.tpl === tplId);
const sessionsFor = (tplId) => SESSIONS.filter(s => s.tpl === tplId).length;

/* Стандарт, который проверяет лист: один на лист, поэтому без обрезки и переносов */
function stdCell(t) {
  const i = stdInfo(t.std);
  if (!i) return t.status === 'archived' ? '<span class="rg3 m2">—</span>' : tag('tg-warn sm', 'не выбрана');
  return `<span class="rg3" style="display:block">${esc(i.name)}</span>`;
}

/* Строка шаблона: состав и должности — одной серой строкой под названием, а не отдельными колонками */
function tplRow(t) {
  const n = tplCriteria(t).length;
  const meta = [`${cnt(t.blocks.length,['блок','блока','блоков'])} · ${cnt(n,['критерий','критерия','критериев'])}`, tplProfiles(t).join(', ')].filter(Boolean).join(' · ');
  return `<tr class="clk r" data-tpl="${t.id}" tabindex="0">
    <td><div class="flat-name">${esc(t.name)}</div><div class="flat-sub row wrap" style="gap:4px 8px">${t.status==='draft' ? tag('tg-warn sm','Черновик') : ''}<span>${esc(meta)}</span></div></td>
    <td class="hm">${stdCell(t)}</td>
    <td class="rg3 nowrap hm">${esc(t.updated)}</td>
    <td class="pv-c"><button class="ib s pv" type="button" data-preview-tpl="${t.id}" data-preview-mode="fill" title="Предпросмотр" aria-label="Предпросмотр листа «${esc(t.name)}»">${ic('eye',20)}</button></td>
  </tr>`;
}

function viewTemplates() {
  const f = S.templates;
  const list = TEMPLATES.filter(tplMatches);
  const tabs = [['published','Действующие'],['draft','Черновики'],['archived','Архив']];
  const createBtn = `<button class="btn b-neutral" type="button" data-act="new-tpl">${ic16('plus')} Создать шаблон</button>`;
  const empty = !(f.q || f.dir || f.profile) && f.tab === 'draft'
    ? emptyState('Черновиков нет', 'Новый шаблон остаётся черновиком, пока его не опубликуют.', createBtn)
    : emptyState('Ничего не найдено', 'Измените условия поиска или создайте новый шаблон.', createBtn);
  const table = `<div class="tbw sc"><table class="flat-tb"><thead><tr><th style="width:42%;min-width:280px">Название</th><th class="hm" style="width:40%;min-width:220px">Компетенция</th><th class="hm" style="width:18%;min-width:120px">Изменён</th><th class="pv-c"><span class="vh">Предпросмотр</span></th></tr></thead>
    <tbody>${list.map(tplRow).join('') || `<tr><td colspan="4">${empty}</td></tr>`}</tbody></table></div>`;

  return page({
    title:'Шаблоны оценочных листов',
    sub: SECTION_SUB.templates,
    actions:`<button class="btn b-neutral" type="button" data-act="new-tpl">${ic16('plus')} Создать шаблон</button>`,
    tabs:`<div class="tabs">${tabs.map(([id,l])=>`<button class="tb-i ${f.tab===id?'on':''}" type="button" data-ttab="${id}">${l}</button>`).join('')}</div>`,
    body:`<div class="fbar">
        ${searchBox(f.q, 'Название, компетенция, должность', 'q')}
        <select class="sl" data-filter="dir" aria-label="Направление">${opt('', 'Все направления', f.dir)}${COMP_GROUPS.map(g => opt(g, g, f.dir)).join('')}</select>
        <select class="sl" data-filter="profile" aria-label="Профиль должности">${opt('', 'Все профили должностей', f.profile)}${ROLES.map(r => opt(r, r, f.profile)).join('')}</select>
        ${(f.q||f.dir||f.profile) ? `<button class="chip" type="button" data-filter-reset="templates">Сбросить</button>` : ''}
      </div>
      ${table}`
  });
}

/* ═══════════════ КОНСТРУКТОР ═══════════════ */
/* Четыре вкладки вместо шести: «Критерии» — сам лист; «Настройки» — что это за лист, как считается итог и кто видит отчёт;
   «Форма заполнения» — графы, которые оценивающий заполняет помимо критериев; «Предпросмотр» — как это выглядит для разных ролей. */
const BUILDER_TABS = [['structure','Критерии'],['settings','Настройки'],['fields','Форма заполнения'],['preview','Предпросмотр']];

function viewBuilder() {
  const t = tplById(S.arg) || TEMPLATES[0];
  const st = TPL_STATUS[t.status], b = S.builder, n = tplCriteria(t).length;
  const ro = t.status === 'archived';
  const head = `<div class="pbar-top">
    <div class="bar-top"><nav class="crumbs" style="margin:0">${crumb([{label:'← Шаблоны', go:'templates'}])}</nav>
      <div class="pacts">
        <span class="tt dn"><button class="ib" type="button" data-act="dup-tpl" data-id="${t.id}" aria-label="Дублировать">${ic('copy')}</button><span class="bubble">Дублировать</span></span>
        <span class="tt dn"><button class="ib acc" type="button" data-act="new-rule-for" data-id="${t.id}" aria-label="Создать правило автозапуска">${ic('bolt')}</button><span class="bubble">Создать правило автозапуска</span></span>
        ${t.status!=='archived' ? `<span class="tt dn"><button class="ib neg" type="button" data-act="archive-tpl" data-id="${t.id}" aria-label="В архив">${ic('trash')}</button><span class="bubble">В архив</span></span>` : `<button class="btn b-ghost" type="button" data-act="restore-tpl" data-id="${t.id}">Вернуть из архива</button>`}
        ${ro ? '' : `<button class="btn b-neutral" type="button" data-act="publish" data-id="${t.id}">${t.status==='published'?'Новая версия':'Опубликовать'}</button>`}
      </div>
    </div>
    <div class="ptitle">
      <div class="tx">
        <div class="row" style="gap:12px">
          ${ro ? `<h1 class="t3" style="margin:0">${esc(t.name)}</h1>` : `<span class="name-grp"><span class="name-wrap" data-v="${esc(t.name)}"><input class="name-in" value="${esc(t.name)}" data-tpl-name="${t.id}" aria-label="Название шаблона"></span><span class="name-pen" aria-hidden="true">${ic('edit',20)}</span></span>`}
          ${tag(st.tag, t.status === 'draft' ? st.label : st.label + ' · v' + t.version)}
        </div>
        ${stdLine(t, ro)}
      </div>
    </div>
  </div>
  <div class="tabs">${BUILDER_TABS.map(([id,l])=>`<button class="tb-i ${b.tab===id?'on':''}" type="button" data-btab="${id}">${l}${id==='structure'?`<span class="c">${n}</span>`:''}</button>`).join('')}</div>`;

  if (b.tab === 'structure') {
    const maxScore = tplCriteria(t).reduce((a,c)=>a+scaleMax(scaleById(c.scale)),0);
    return head + `<div class="bld">
      <div class="bld-main sc">${builderStructure(t, ro)}</div>
      <aside class="bld-side sc ${S.builder.selected && findCrit(t, S.builder.selected) ? 'on' : ''}">${builderSide(t, ro)}</aside>
      <div class="bld-bar">
        <span class="rg3 m2">${cnt(t.blocks.length,['блок','блока','блоков'])} · ${cnt(n,['критерий','критерия','критериев'])} · максимум ${maxScore} ${plural(maxScore,['балл','балла','баллов'])}</span>
        <div class="sp"></div>
        ${t.blocks.length ? `<button class="btn b-tert s" type="button" data-act="collapse-all">Свернуть все</button><button class="btn b-tert s" type="button" data-act="expand-all">Развернуть все</button>` : ''}
      </div>
    </div>`;
  }
  return head + `<div class="scroll sc">${builderTab(t, ro)}</div>`;
}

function builderStructure(t, ro) {
  if (!t.blocks.length) {
    return emptyState('В шаблоне пока нет критериев для проверки навыка', 'Добавьте блоки с критериями — или загрузите готовый набор из Excel.',
      `<button class="btn b-ghost" type="button" data-act="import">${ic16('excel')} Загрузить из Excel</button><button class="btn b-neutral" type="button" data-act="add-block">${ic16('plus')} Добавить блок</button>`);
  }
  const blocks = t.blocks.map((b, bi) => {
    const collapsed = S.builder.collapsed[b.id];
    const rows = b.criteria.map((c, ci) => {
      const sc = scaleById(c.scale);
      /* Вариант A: колонки всегда на одних местах. Красный флаг — только у критичных; шкала — серым текстом (тёмным, если у критерия своя);
         комментарий и вложение — значками: тёмный значок — настройка включена, пусто — по умолчанию */
      const flag = c.critical ? `<span class="cr-fl tt l" role="img" aria-label="Критичный критерий">${ic16('flag')}<span class="bubble">Критичный критерий — провал критерия делает лист не пройденным</span></span>` : '<span class="cr-fl"></span>';
      const crit = c.critical ? `<span class="cr-m crit tt l">${ic16('warn')}Критичный<span class="bubble">Критичный критерий — провал критерия делает лист не пройденным</span></span>` : '';
      const meta = (c.critical || c.comment === 'required' || c.attach)
        ? `<span class="cr-meta">${crit}${c.comment === 'required' ? `<span class="cr-m">${ic16('comment')}Комментарий обязателен</span>` : ''}${c.attach ? `<span class="cr-m">${ic16('attach')}Фото или файл</span>` : ''}</span>` : '';
      /* формулировка правится прямо в списке, как название блока: в панели справа остаются только настройки критерия */
      return `<div class="cr ${S.builder.selected===c.id?'on':''}" data-crit="${c.id}" ${ro ? 'role="button" tabindex="0"' : ''}>
        ${ro?'':`<span class="grip" draggable="true" data-grip="crit" data-id="${c.id}" tabindex="0" role="button" title="Перетащить критерий" aria-label="Перетащить критерий ${ci+1} блока ${bi+1}. Стрелки вверх и вниз — переместить">${ic('grip',16)}</span>`}
        ${c.critical ? '<span class="cr-bar" aria-hidden="true"></span>' : ''}<span class="no">${ci+1}</span>
        <span class="bd">
          ${ro ? `<span class="txt">${esc(c.text) || '<span class="m2">Без формулировки</span>'}</span>`
               : `<textarea class="cr-in" rows="1" data-crit-text="${c.id}" aria-label="Формулировка критерия ${ci+1} блока ${bi+1}" placeholder="Формулировка критерия">${esc(c.text)}</textarea>`}
          ${meta}
        </span>
        ${ro?'':`<span class="acts">
          <button class="ib xs" type="button" data-act="dup-crit" data-id="${c.id}" title="Дублировать" aria-label="Дублировать">${ic('copy',16)}</button>
          <button class="ib xs neg" type="button" data-act="del-crit" data-id="${c.id}" title="Удалить" aria-label="Удалить">${ic('trash',16)}</button>
        </span>`}
      </div>`;
    }).join('');
    return `<section class="blk ${collapsed?'collapsed':''}" data-blk="${b.id}">
      <header class="blk-h">
        ${ro?'':`<span class="grip" draggable="true" data-grip="block" data-id="${b.id}" tabindex="0" role="button" title="Перетащить блок" aria-label="Перетащить блок ${bi+1}. Стрелки вверх и вниз — переместить">${ic('grip',16)}</span>`}
        <button class="ib s" type="button" data-act="toggle-block" data-id="${b.id}" title="${collapsed?'Развернуть':'Свернуть'}" aria-label="${collapsed?'Развернуть блок':'Свернуть блок'}"><span style="display:inline-flex;transition:transform .15s;transform:rotate(${collapsed?-90:0}deg)">${ic('chev',16)}</span></button>
        ${ro?`<b class="sub1" style="flex:1">${esc(b.name)}</b>`:`<input class="nm" value="${esc(b.name)}" data-block-name="${b.id}" aria-label="Название блока" placeholder="Название блока">`}
        <span class="rg4 m2 nowrap">${cnt(b.criteria.length,['критерий','критерия','критериев'])}</span>
        ${ro?'':`<button class="ib s neg" type="button" data-act="del-block" data-id="${b.id}" title="Удалить блок" aria-label="Удалить блок">${ic('trash',16)}</button>`}
      </header>
      <div class="blk-b">${rows || `<div class="rg4 m2" style="padding:8px 12px">В блоке пока нет критериев</div>`}</div>
      ${ro?'':`<div class="blk-f"><button class="cr-add" type="button" data-act="add-crit" data-id="${b.id}">${ic16('plus')} Добавить критерий</button></div>`}
    </section>`;
  }).join('');
  return `${t.imported ? `<div style="margin-bottom:16px">${alertBox('al-pos','Структура загружена из файла', `Распознано ${cnt(t.blocks.length,['блок','блока','блоков'])} и ${cnt(tplCriteria(t).length,['критерий','критерия','критериев'])}. Проверьте формулировки, выберите компетенцию, которую проверяет лист, и опубликуйте. В прототипе распознаётся файл-образец «Безопасная работа на объекте».`)}</div>` : ''}
    ${blocks}${ro?'':`<button class="blk-add" type="button" data-act="add-block">${ic16('plus')} Добавить блок</button>`}`;
}

/* при открытии шаблона блоки свёрнуты: сначала виден состав листа, критерии раскрывают по нужде */
const collapsedFor = (tplId) => { const t = tplById(tplId), m = {}; if (t) t.blocks.forEach(b => { m[b.id] = true; }); return m; };
function findCrit(t, id) {
  for (const b of t.blocks) { const i = b.criteria.findIndex(c => c.id === id); if (i >= 0) return { b, c:b.criteria[i], i, bi:t.blocks.indexOf(b) }; }
  return null;
}

/* Выбор критерия: подсвечиваем строку и меняем панель справа, а список не перерисовываем — иначе из поля формулировки пропал бы курсор */
function selectCrit(id) {
  const t = currentTpl(); S.builder.selected = id;
  document.querySelectorAll('.cr.on').forEach(r => r.classList.remove('on'));
  const row = document.querySelector(`[data-crit="${id}"]`); if (row) row.classList.add('on');
  const side = document.querySelector('.bld-side');
  if (side) { side.innerHTML = builderSide(t, t.status === 'archived'); side.classList.toggle('on', !!findCrit(t, id)); }
}

/* Панель критерия: только то, что настраивают у критерия. Предпросмотр значений шкалы, карточка со статистикой
   компетенции и дубли кнопок «Дублировать/Удалить» убраны — всё это есть в списке слева. */
/* что значит «критичный» в этом листе — зависит от способа определить итог */
function critHint(t) {
  if (t.verdictMode === 'manual') return 'Не выполнен — выделяется в отчёте, а пройден ли лист, решает оценивающий';
  if (t.critZero === false) return 'Не выполнен — выделяется в отчёте, на итог не влияет (так задано в блоке «Как определяется итог»)';
  return 'Не выполнен — лист не пройден, сколько бы баллов ни набрали';
}
const ILLU_PICK = '<svg width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true"><rect x="16" y="8" width="48" height="64" rx="9" stroke="#AABBCA" stroke-width="3"/><rect x="25" y="26" width="7" height="7" rx="2" stroke="#AABBCA" stroke-width="2.5"/><rect x="25" y="40" width="7" height="7" rx="2" stroke="#AABBCA" stroke-width="2.5"/><rect x="25" y="54" width="7" height="7" rx="2" stroke="#AABBCA" stroke-width="2.5"/><path d="M38 29.5h17M38 43.5h11M38 57.5h15" stroke="#AABBCA" stroke-width="3" stroke-linecap="round"/><path d="M0 0v16l4.5-4 3 7.5 2.8-1.1-2.9-7.2H13z" transform="translate(50 44) scale(1.7)" fill="#0070FF" style="stroke:var(--g98);stroke-width:1.6;stroke-linejoin:round;paint-order:stroke"/></svg>';
function builderSide(t, ro) {
  const found = S.builder.selected ? findCrit(t, S.builder.selected) : null;
  if (!found) {
    return `<div class="bld-side-h"><div class="row"><b class="sub1">Настроить критерий</b></div></div>
      <div class="bld-side-b bld-empty">${ILLU_PICK}<p class="rg3 m2">Выберите критерий слева — здесь отобразятся его настройки</p></div>`;
  }
  const { c, b, i, bi } = found;
  const dis = ro ? 'disabled' : '';
  return `<div class="bld-side-h">
      <div class="row"><b class="sub1">Настроить критерий</b><span class="sp"></span><button class="ib xs" type="button" data-act="deselect" title="Закрыть" aria-label="Закрыть панель">${ic('close',16)}</button></div>
      <div class="row" style="margin-top:6px"><span class="tg tg-accent">Критерий ${i+1}</span><span class="rg4 m2" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name) || 'Блок без названия'}</span></div>
    </div>
    <div class="bld-side-b">
      <div class="swrow"><div class="tx"><b>Критичный</b><span>${critHint(t)}</span></div><button class="sw" type="button" role="switch" aria-checked="${c.critical}" aria-label="Критичный критерий" data-crit-switch="critical" ${dis}></button></div>
      <div class="fl"><label>Шкала оценки</label>
        <select class="sl" data-crit-field="scale" ${dis}>${SCALES.map(s=>opt(s.id, s.name, c.scale)).join('')}</select></div>
      <div class="fl"><label>Комментарий оценивающего</label>
        <select class="sl" data-crit-field="comment" ${dis}>${opt('hidden','Скрыт',c.comment)}${opt('optional','По желанию',c.comment)}${opt('required','Обязателен',c.comment)}</select></div>
      <div class="fl"><label>Пояснение для сотрудника: как показать навык в работе <span class="opt">необязательно</span></label>
        <textarea class="ta" rows="3" placeholder="Что именно сотрудник должен сделать, чтобы критерий засчитали. Увидит до проверки" data-crit-field="hint" ${dis}>${esc(c.hint||'')}</textarea></div>
      <div class="swrow"><div class="tx"><b>Требовать фото или файл</b><span>Для регуляторных критериев и спорных ситуаций</span></div><button class="sw" type="button" role="switch" aria-checked="${c.attach}" aria-label="Требовать фото или файл" data-crit-switch="attach" ${dis}></button></div>
    </div>`;
}

/* ── вкладки конструктора ── */
const fieldRow = (kind, f, i, dis, ro) => kind === 'general'
  ? `<div class="fld"><div class="fld-r">
      <input class="in" value="${esc(f.label)}" placeholder="Название поля" data-general-field="label" data-idx="${i}" aria-label="Название поля" ${dis}>
      <select class="sl" data-general-field="type" data-idx="${i}" aria-label="Тип поля" ${dis}>${opt('text','Текст',f.type === 'dict' ? 'dict' : 'text')}${opt('dict','Справочник',f.type === 'dict' ? 'dict' : 'text')}</select>
      <label class="fld-sw">обязательное <button class="sw" type="button" role="switch" aria-checked="${f.required}" aria-label="Обязательное поле" data-general-switch="${i}" ${dis}></button></label>
      ${ro?'':`<button class="ib xs neg" type="button" data-act="del-general" data-idx="${i}" title="Удалить" aria-label="Удалить поле">${ic('trash',16)}</button>`}</div>
      <div class="fld-r2"><input class="in" value="${esc(f.hint)}" placeholder="Подсказка — видна до заполнения" data-general-field="hint" data-idx="${i}" aria-label="Подсказка" ${dis}>${f.type === 'dict' ? `<select class="sl" data-general-field="dict" data-idx="${i}" aria-label="Справочник" ${dis}>${DICT_NAMES.map(n => opt(n, n, f.dict || DICT_NAMES[0])).join('')}</select>` : ''}</div></div>`
  : `<div class="fld"><div class="fld-r fb">
      <input class="in" value="${esc(f.label)}" data-feedback-field="label" data-idx="${i}" aria-label="Название поля" style="font-weight:600" ${dis}>
      <label class="fld-sw">обязательное <button class="sw" type="button" role="switch" aria-checked="${f.required}" aria-label="Обязательное поле" data-feedback-switch="${i}" ${dis}></button></label>
      ${ro?'':`<button class="ib xs neg" type="button" data-act="del-feedback" data-idx="${i}" title="Удалить" aria-label="Удалить поле">${ic('trash',16)}</button>`}</div></div>`;

/* Максимум баллов по текущей настройке листа: у каждого критерия — наибольший балл его шкалы. Только для справки администратору */
const maxScore = (t) => tplCriteria(t).reduce((n, c) => n + scaleMax(scaleById(c.scale || t.scale)), 0);

/* «Как определяется итог»: сначала баллы и результат в процентах, потом способ понять, пройден ли лист, —
   по баллам и проходному порогу или по решению того, кто оценивал */
function resultCard(t, dis, nCrit) {
  const maxField = `<div class="fl"><label>Максимум баллов в листе ${infoDot('Сумма наибольших баллов шкал по всем критериям. Меняется вместе с критериями и шкалами листа.')}</label><input class="in" value="${maxScore(t)}" disabled aria-label="Максимум баллов в листе"></div>`;
  const manual = t.verdictMode === 'manual';
  const modes = [['score', 'Расчёт по баллам'], ['manual', 'Решение оценивающего']];
  const hint = manual
    ? 'Баллы считаются и показываются для справки. Пройден лист или нет, решает тот, кто оценивал: при завершении сессии он выбирает «Пройден» или «Не пройден». Проходной балл в этом случае не используется.'
    : 'Итог считается сам: набранные баллы делятся на максимум. Если задать проходной балл, лист считается выполненным, когда результат не ниже него, иначе — не пройденным.';
  return `<div class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">Как определяется итог</h3></div></div>
      <div class="col4">
        <div class="fl"><label>Пройден лист или нет, определяет</label>
          <div class="sg sg-fit" role="group" aria-label="Как определяется итог">${modes.map(([k, l]) => `<button type="button" class="${(manual ? 'manual' : 'score') === k ? 'on' : ''}" data-verdict-mode="${k}" ${dis}>${l}</button>`).join('')}</div>
          <span class="hlp">${hint}</span></div>
        ${manual ? `<div class="hint"><span class="ic">${ic16('info')}</span><div>Критичные критерии остаются отметкой в отчёте: проваленный критичный критерий выделяется, но итог не меняет — решение за оценивающим.</div></div><div class="g2">${maxField}</div>` : `
        <div class="g2">
          <div class="fl"><label>Проходной балл, %</label><input class="in" type="number" min="0" max="100" value="${t.pass!=null?t.pass:''}" placeholder="не задан" data-tpl-field="pass" ${dis}></div>
          ${maxField}
        </div>
        <div class="swrow"><div class="tx"><b>Критичные критерии обнуляют итог</b><span>${nCrit ? `В шаблоне ${cnt(nCrit,['критичный критерий','критичных критерия','критичных критериев'])}` : 'Критичных критериев пока нет — отметьте их в настройках критерия'}</span></div><button class="sw" type="button" role="switch" aria-checked="${t.critZero!==false}" aria-label="Критичные критерии обнуляют итог" data-tpl-switch="critZero" ${dis}></button></div>`}
      </div>
    </div>`;
}

function builderTab(t, ro) {
  const dis = ro ? 'disabled' : '';
  const W = (inner) => `<div class="col5" style="max-width:860px">${inner}</div>`;
  const tab = S.builder.tab;

  if (tab === 'settings') {
    const nCrit = tplCriteria(t).filter(c=>c.critical).length;
    return W(`
    ${stdCard(t, ro)}
    <div class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">Общие настройки</h3></div></div>
      <div class="col4">
        <div class="fl"><label>Для чего этот лист</label>
          <textarea class="ta" data-tpl-field="purpose" ${dis}>${esc(t.purpose)}</textarea></div>
      </div>
    </div>
    ${resultCard(t, dis, nCrit)}`);
  }

  if (tab === 'fields') return W(`
    <div class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">Что заполнить до начала</h3><p>Добавьте поля, которые оценивающий заполнит перед проверкой, они попадут в отчёт. Например: место проведения, цель</p></div>
      ${ro?'':`<button class="btn b-ghost s" type="button" data-act="add-general">${ic16('plus')} Добавить поле</button>`}</div>
      <div>${t.general.length ? t.general.map((f,i)=>fieldRow('general', f, i, dis, ro)).join('') : emptyState('Полей пока нет', 'Добавьте поле, и оценивающий увидит его перед началом проверки.', ro ? '' : `<button class="btn b-ghost s" type="button" data-act="add-general">${ic16('plus')} Добавить поле</button>`)}</div>
    </div>
    <div class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">Обратная связь</h3><p>Заполняется после критериев.</p></div>
      ${ro?'':`<button class="btn b-ghost s" type="button" data-act="add-feedback">${ic16('plus')} Добавить поле</button>`}</div>
      <div>${t.feedback.length ? t.feedback.map((f,i)=>fieldRow('feedback', f, i, dis, ro)).join('') : emptyState('Полей пока нет', 'Без обратной связи сессия заканчивается баллом и ничем больше.')}</div>
    </div>`);

  if (tab === 'preview') return builderPreview(t);
  return '';
}

/* ── предпросмотр: три взгляда на один лист ── */
/* Какой критерий показывает пример заполнения: после «Дальше» — следующий, при открытии вкладки — выбранный на вкладке «Критерии», без выбора — первый */
function previewIndex(t) {
  const flat = tplCriteria(t);
  const i = S.builder.pvi != null ? S.builder.pvi : flat.findIndex(c => c.id === S.builder.selected);
  return i < 0 || i >= flat.length ? 0 : i;
}
/* Предпросмотр на планшете: форма целиком, как на экране заполнения. Поля и варианты ответа только показаны, их нельзя заполнить */
function tabletFill(t) {
  const on = (t.general || []).filter(g => g.enabled !== false && (g.label || '').trim());
  const general = on.length ? `<div class="tb-sec"><div class="tb-h">Перед началом</div><div class="g2">${on.map(g => `<div class="fl"><label>${esc(g.label)}${g.required ? ' <span class="req">*</span>' : ''}</label>${g.type === 'dict' ? `<select class="sl" tabindex="-1" disabled><option>${esc(g.hint || 'Выберите значение')}</option></select>` : `<input class="in" placeholder="${esc(g.hint || '')}" tabindex="-1" readonly>`}</div>`).join('')}</div></div>` : '';
  const blocks = t.blocks.map((b, bi) => `<div class="tb-sec"><div class="tb-h">${bi + 1}. ${esc(b.name)}</div>${b.criteria.map((c, ci) => {
    const sc = scaleById(c.scale);
    return `<div class="tb-c"><div class="row top" style="gap:12px"><span class="rg3 m2 fc-no">${bi + 1}.${ci + 1}</span><div style="flex:1;min-width:0"><div class="fc-t">${esc(c.text)}${c.critical ? ' ' + tag('tg-neg', 'критичный') : ''}</div>${c.hint ? `<p class="rg4 m2" style="margin-top:4px">${esc(c.hint)}</p>` : ''}</div></div>
      <div class="fc-opts">${sc.values.map(v => `<span class="opt-row" style="pointer-events:none"><span class="rd" aria-hidden="true"></span><span>${esc(v.label)}</span></span>`).join('')}${c.comment !== 'hidden' ? `<span class="btn b-gray2 xs" style="pointer-events:none">${c.comment === 'required' ? 'Комментарий обязателен' : '+ Комментарий'}</span>` : ''}${c.attach ? '<span class="btn b-gray2 xs" style="pointer-events:none">+ Фото или файл</span>' : ''}</div></div>`;
  }).join('')}</div>`).join('');
  const fb = (t.feedback || []).length ? `<div class="tb-sec"><div class="tb-h">Обратная связь</div>${t.feedback.map(f => f.structured ? `<div class="fl"><label>${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</label><div class="col" style="gap:8px"><input class="in" placeholder="70 — что отработать в реальной работе" tabindex="-1" readonly><input class="in" placeholder="20 — что разобрать с наставником" tabindex="-1" readonly><input class="in" placeholder="10 — какое обучение пройти" tabindex="-1" readonly></div></div>` : `<div class="fl"><label>${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</label><textarea class="ta" rows="2" tabindex="-1" readonly></textarea></div>`).join('')}</div>` : '';
  return `<div class="col4"><div><div class="rg4 m2">Сессия · ${esc(t.name)}</div><h3 class="t5" style="margin-top:2px">${esc(EMPLOYEES[0].name)}</h3><div class="rg4 m2">${esc(EMPLOYEES[0].role)} · ${esc(EMPLOYEES[0].unit)}</div></div>${general}${blocks}${fb}<div class="row" style="gap:8px"><span class="btn b-ghost" style="pointer-events:none">Продолжить позже</span><span class="btn b-neutral" style="pointer-events:none">Завершить сессию</span></div></div>`;
}
function builderPreview(t) {
  const mode = S.builder.preview, dev = S.builder.device === 'tablet' ? 'tablet' : 'phone';
  /* пример заполнения: показываем критерий, выбранный на вкладке «Критерии», без выбора — первый; «Дальше» листает критерии,
     поэтому видно, как выглядит любой из них: подсказка, комментарий, фото или файл, критичность */
  const flat = []; t.blocks.forEach((b, bi) => b.criteria.forEach((c, ci) => flat.push({ b, c, bi, ci })));
  const total = flat.length, pi = previewIndex(t), cur = flat[pi];
  const first = cur && cur.b, c0 = cur && cur.c, sc = c0 ? scaleById(c0.scale) : scaleById(t.scale);
  let inner;
  if (mode === 'fill' && dev === 'tablet') {
    inner = tabletFill(t);
  } else if (mode === 'fill') {
    inner = `<div class="col4">
      <div><div class="rg4 m2">Сессия · ${esc(t.name)}</div><h3 class="t5" style="margin-top:2px">Никитин Павел</h3><div class="rg4 m2">Электромонтажник · БЦ «Северный»</div></div>
      <div class="row" style="gap:8px"><span class="tg tg-accent">Блок ${cur ? cur.bi + 1 : 1} из ${t.blocks.length}</span><span class="tg tg-gray">${pi} из ${total}</span></div><hr class="hr">
      ${c0 ? `<div><div class="sub3 m2" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${esc(first.name)}</div><div class="lb3" style="font-size:15px;line-height:22px">${cur.bi + 1}.${cur.ci + 1} ${esc(c0.text)}${c0.critical ? ' ' + tag('tg-neg', 'критичный') : ''}</div>${c0.hint?`<p class="rg4 m2" style="margin-top:6px">${esc(c0.hint)}</p>`:''}</div>
      <div class="col" style="gap:8px" id="prev-opts">${sc.values.map((v,i)=>`<button class="opt-row ${i===0?'on':''}" type="button" data-prevopt="${i}"><span class="rd" aria-checked="${i===0}" style="pointer-events:none"></span><span>${esc(v.label)}</span></button>`).join('')}</div>
      ${c0.comment!=='hidden'?`<button class="btn b-gray2" type="button" style="width:100%">${ic16('plus')} Комментарий</button>`:''}
      ${c0.attach ? `<div class="col" style="gap:4px"><button class="btn b-gray2" type="button" style="width:100%">${ic16('plus')} Фото или файл</button><span class="rg4 m2">Обязательно: без файла сессию не завершить</span></div>` : ''}` : '<p class="rg3 m2">В шаблоне пока нет критериев.</p>'}
      <hr class="hr"><div class="row" style="gap:8px"><button class="btn b-ghost" type="button" style="flex:1">Продолжить позже</button><button class="btn b-neutral" type="button" style="flex:1" data-act="pv-next">${total && pi === total - 1 ? 'Начать заново' : 'Дальше'}</button></div>
    </div>`;
  } else if (mode === 'employee') {
    inner = `<div class="col4">
      <div><div class="rg4 m2">К чему готовиться</div><h3 class="t5" style="margin-top:2px">${esc(t.name)}</h3><div class="rg4 m2">Так вас будут оценивать. Под каждым пунктом — как показать навык в работе.</div></div>
      ${t.blocks.map((b,bi)=>`<div><div class="sub3 m2" style="text-transform:uppercase;letter-spacing:.06em;margin:6px 0 4px">${bi+1} · ${esc(b.name)}</div><div class="read-list">${b.criteria.map((c,ci)=>`<div class="read-item"><span class="chk"></span><div><div class="t">${esc(c.text)}</div>${c.hint?`<div class="h">${esc(c.hint)}</div>`:''}</div></div>`).join('')}</div></div>`).join('')}
      <div class="fl"><label>Какие вопросы возникли при подготовке</label><textarea class="ta" placeholder="Станут повесткой встречи с наставником"></textarea></div>
    </div>`;
  }
  return `<div class="col5" style="max-width:1080px">
    <div class="row" style="gap:12px"><div class="sg">
      <button class="${mode==='fill'?'on':''}" type="button" data-preview="fill">Заполняет оценивающий</button>
      <button class="${mode==='employee'?'on':''}" type="button" data-preview="employee">Читает сотрудник до сессии</button>
    </div><span class="sp"></span><div class="sg" role="group" aria-label="Устройство">${[['phone', 'Телефон'], ['tablet', 'Планшет']].map(([k, l]) => `<button class="${dev === k ? 'on' : ''}" type="button" data-device="${k}">${l}</button>`).join('')}</div></div>
    <div class="phone-wrap"><div class="phone ${dev === 'tablet' ? 'tablet' : ''}"><div class="phone-top">Оценочные листы</div><div class="phone-body sc">${inner}</div></div></div>
  </div>`;
}


</script>
<script>
'use strict';
/* ═══════════════ ПРАВИЛА ЗАПУСКА ═══════════════ */
/* Правила — таблицей, как шаблоны и сессии: раньше каждое правило было карточкой на 8–10 строк
   (цепочка чипов, три реакции, счётчики запусков). Подробности и реакции — в окне правила по клику. */
function viewRules() {
  const f = S.rules, fTpl = f.tpl ? tplById(f.tpl) : null;
  const list = RULES.filter(r => {
    if (f.tpl && r.tpl !== f.tpl) return false;
    if (f.q) { const t = r.tpl ? tplById(r.tpl) : null; const hay = [r.name, r.when, r.whom, t?t.name:'', r.by, ruleRepeat(r)].join(' ').toLowerCase(); if (!hay.includes(f.q.toLowerCase())) return false; }
    return true;
  });
  const rows = list.map(r => {
    const t = r.tpl ? tplById(r.tpl) : null;
    return `<tr class="clk r ${r.enabled?'':'off'}" data-rule="${r.id}" tabindex="0">
      <td><div class="flat-name">${esc(r.name)}</div><div class="flat-sub">${esc(ruleRepeat(r))}</div></td>
      <td><div class="rg3">${esc(r.when)}</div><div class="flat-sub mo">${esc(r.whom)}</div></td>
      <td class="rg3 hm">${esc(r.whom)}</td>
      <td class="rg3 hm">${t ? esc(t.name) : 'Тот же лист'}</td>
      <td class="rg3 hm">${esc(r.by)}</td>
      <td class="hm"><button class="tg tg-accent" type="button" data-goto-sessions="${r.id}" title="Открыть сессии этого правила">${cnt(r.runs, ['сессия','сессии','сессий'])}</button></td>
      <td class="nowrap"><button class="sw" type="button" role="switch" aria-checked="${r.enabled}" aria-label="Правило «${esc(r.name)}» включено" data-rule-toggle="${r.id}"></button><span class="rg4 m2 hm" style="margin-left:8px;vertical-align:middle">${r.enabled ? 'Активно' : 'Остановлено'}</span></td>
    </tr>`;
  }).join('');

  return page({
    title:'Правила автозапуска',
    sub: SECTION_SUB.rules,
    actions:`<button class="btn b-neutral" type="button" data-act="new-rule">${ic16('plus')} Создать правило</button>`,
    body:`<div class="fbar">
        ${searchBox(f.q, 'Правило, условие или шаблон', 'q')}
        ${fTpl ? `<button class="chip on" type="button" data-filter-reset="rules" title="Показать правила всех шаблонов">Лист: ${esc(fTpl.name)} ✕</button>` : ''}
        ${f.q && !fTpl ? `<button class="chip" type="button" data-filter-reset="rules">Сбросить</button>` : ''}
      </div>
      <div class="tbw sc"><table class="flat-tb">
        <thead><tr><th style="min-width:200px">Правило</th><th style="min-width:200px">Условие запуска</th><th class="hm" style="min-width:170px">Для кого</th><th class="hm" style="min-width:170px">Лист</th><th class="hm">Кто оценивает</th><th class="hm" style="min-width:110px">Создано</th><th style="min-width:120px">Статус</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7">${emptyState(fTpl ? 'У этого шаблона пока нет правил' : 'Правил не найдено', fTpl ? 'Сессии по нему пока создаются вручную.' : 'Измените фильтры или создайте новое правило.')}</td></tr>`}</tbody>
      </table></div>`
  });
}

/* ═══════════════ ШКАЛЫ ОЦЕНКИ ═══════════════ */
const scaleUsage = (id) => TEMPLATES.filter(t => t.scale === id || tplCriteria(t).some(c => c.scale === id));

function viewScales() {
  const f = S.scales;
  const list = SCALES.filter(s => !f.q || [s.name, s.desc, ...s.values.map(v=>v.label)].join(' ').toLowerCase().includes(f.q.toLowerCase()));
  const cards = list.map(s => {
    const open = f.open === s.id, used = scaleUsage(s.id);
    return `<article class="sc-card ${open?'open':''}" id="scale-${s.id}">
      <div class="sc-head" data-scale-open="${s.id}">
        <span class="chev">${ic('chev',18)}</span>
        <div style="flex:1;min-width:0">
          <div class="row" style="gap:8px"><b class="sub1">${esc(s.name)}</b>${s.isDefault ? tag('tg-accent sm', 'По умолчанию') : ''}</div>
          <div class="row wrap" style="gap:4px;margin-top:6px">${s.values.map(v=>`<span class="tg ${v.excluded?'tg-gray':'tg-neutral'} sm">${esc(v.label)}${v.score!=null?' · '+v.score:''}</span>`).join('')}</div>
        </div>
        <span class="rg4 m2 nowrap">${used.length ? `в ${cnt(used.length,['шаблоне','шаблонах','шаблонах'])}` : 'не используется'}</span>
      </div>
      ${open ? `<div class="sc-body">
        <div class="fl" style="margin:12px 0 16px"><label>Название</label><input class="in" value="${esc(s.name)}" data-scale-field="name" data-id="${s.id}"></div>
        <div class="fl" style="margin-bottom:8px"><label>Описание <span class="opt">необязательно</span></label><input class="in" value="${esc(s.desc)}" data-scale-field="desc" data-id="${s.id}" placeholder="Когда использовать эту шкалу"></div>
        <div class="swrow" style="padding-top:0"><div class="tx"><b>Шкала по умолчанию</b><span>${DEFAULT_SCALE_HINT}</span></div><button class="sw" type="button" role="switch" aria-checked="${!!s.isDefault}" aria-label="Шкала по умолчанию" data-scale-default="${s.id}"></button></div>
        <div class="sc-hd"><span></span><span>Значение</span><span>Баллы</span><span>Что означает</span><span>Вне расчёта</span><span></span></div>
        ${s.values.map((v,i)=>`<div class="sc-row" data-scale="${s.id}" data-idx="${i}">
          <span class="grip" draggable="true" data-grip="value" data-id="${s.id}" data-idx="${i}" tabindex="0" role="button" title="Перетащить значение" aria-label="Перетащить значение ${i+1}. Стрелки вверх и вниз — переместить">${ic('grip',16)}</span>
          <input class="in" value="${esc(v.label)}" data-value-field="label" data-id="${s.id}" data-idx="${i}" placeholder="Название значения">
          <input class="in" type="number" value="${v.score!=null?v.score:''}" placeholder="—" data-value-field="score" data-id="${s.id}" data-idx="${i}" ${v.excluded?'disabled':''}>
          <input class="in" value="${esc(v.hint||'')}" data-value-field="hint" data-id="${s.id}" data-idx="${i}" placeholder="Подсказка оценивающему">
          <span class="excl">${tip('Значение не участвует в расчёте: ситуация не возникла', `<button class="sw" type="button" role="switch" aria-checked="${!!v.excluded}" data-value-excl="${s.id}" data-idx="${i}"></button>`)}</span>
          <span class="row" style="gap:0"><button class="ib xs neg" type="button" data-act="del-value" data-id="${s.id}" data-idx="${i}" title="Удалить">${ic('trash',16)}</button></span>
        </div>`).join('')}
        <div class="row" style="margin-top:12px;gap:8px">
          <button class="btn b-mute s" type="button" data-act="add-value" data-id="${s.id}">${ic16('plus')} Добавить значение</button>
          <span class="sp"></span>
          ${used.length ? `<span class="rg4 m2">Изменения применятся во всех ${cnt(used.length,['шаблоне','шаблонах','шаблонах'])}: ${used.map(t=>esc(t.name)).join(', ')}</span>` : ''}
        </div>
        <hr class="hr" style="margin:16px 0">
        <div class="row" style="gap:8px">
          <button class="btn b-gray2 s" type="button" data-act="dup-scale" data-id="${s.id}">${ic16('copy')} Дублировать</button>
          ${!s.system ? `<button class="btn b-neg2 s" type="button" data-act="del-scale" data-id="${s.id}">${ic16('trash')} Удалить</button>` : ''}
          <span class="sp"></span>
          <button class="btn b-neutral s" type="button" data-scale-open="${s.id}">Готово</button>
        </div>
      </div>` : ''}
    </article>`;
  }).join('');

  return page({
    title:'Шкалы оценок',
    sub: SECTION_SUB.scales,
    actions:`<button class="btn b-neutral" type="button" data-act="new-scale">${ic16('plus')} Создать шкалу</button>`,
    body:`<div class="fbar">${searchBox(f.q, 'Поиск по названию и значениям', 'q')}<span class="sp"></span><span class="rg4 m2">${cnt(SCALES.length,['шкала','шкалы','шкал'])}</span></div>
      <div class="col" style="gap:12px;max-width:980px">${cards || emptyState('Шкал не найдено', 'Измените запрос или создайте новую шкалу.')}</div>`
  });
}

/* ═══════════════ АНАЛИТИКА ═══════════════ */
/* Три вкладки вместо одной страницы из восьми блоков: «Критерии» — где проседает; «Проведение проверок» —
   проводятся ли они вообще; «Стандарты» — картина по всей компании. Строки карты теперь берутся из блоков
   выбранного шаблона, а выводы считаются по самим цифрам — раньше при смене шаблона менялась только подпись. */
const CUTS = {
  branch:{ label:'По объектам',    cols:['БЦ «Северный»','Штаб-квартира банка','Офис ИТ-компании','Башня «Восток»','Субподрядчики'] },
  format:{ label:'По видам работ', cols:['Электромонтаж','Вентиляция','Слаботочные системы','Отделка','Сварка'] },
  mentor:{ label:'По мастерам',    cols:['Волков','Захаров','Ершов','Рябов'] },
  role:  { label:'По должностям',  cols:['Электромонтажник','Монтажник систем вентиляции','Сварщик'] },
  tenure:{ label:'По стажу',       cols:['До 3 мес','3–12 мес','Больше года'] }
};
const PERIODS = {
  q3:{ label:'III квартал 2026', off:0,  d:'+6 пунктов к прошлому кварталу', n:'1 284', plan:'план 1 500 · выполнено 86%', none:'7 из 40', ontime:'63%' },
  q2:{ label:'II квартал 2026',  off:-4, d:'+3 пункта к прошлому кварталу',  n:'1 102', plan:'план 1 400 · выполнено 79%', none:'11 из 40', ontime:'57%' },
  m9:{ label:'Сентябрь 2026',    off:2,  d:'+2 пункта к августу',            n:'438',   plan:'план 500 · выполнено 88%',   none:'5 из 40', ontime:'66%' }
};
const hc = (v) => v>=90?'h90':v>=70?'h75':v>=60?'h60':v>=45?'h45':'h30';
const hashStr = (s) => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 100003; return h; };
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));

/* Данные тепловой карты. У листов с историей: один блок проседает во всех срезах (вопрос к программе обучения),
   другой — в одном срезе (вопрос к условиям на месте). Так на карте видны все пять цветов, а не одна зелёная. */
const HEAT = {
  t1: { base:{ 'Подготовка к работе':88, 'Электробезопасность':71, 'Работа на высоте':83, 'Порядок на рабочем месте':64, 'Действия при опасной ситуации':92 },
        local:{ branch:['Порядок на рабочем месте','Штаб-квартира банка',48], format:['Электробезопасность','Слаботочные системы',58], mentor:['Порядок на рабочем месте','Захаров',55] } },
  t9: { base:{ 'До начала работ':86, 'Во время работ':79, 'После работ':62 },
        local:{ branch:['После работ','Офис ИТ-компании',41], format:['Во время работ','Сварка',63], mentor:['После работ','Ершов',50] } }
};

function heatFor(tplId, cutId) {
  const t = tplById(tplId), cut = CUTS[cutId];
  const rows = t.blocks.map(b => {
    const H0 = HEAT[tplId], base = H0 && H0.base[b.name] != null ? H0.base[b.name] : 58 + hashStr(tplId + b.name) % 34;
    return [b.name, cut.cols.map(c => clampN(base + (hashStr(tplId + b.name + c) % 9) - 4, 20, 98))];
  });
  const loc = HEAT[tplId] ? HEAT[tplId].local[cutId] : null;
  if (loc) { const r = rows.find(x => x[0] === loc[0]), ci = cut.cols.indexOf(loc[1]); if (r && ci >= 0) r[1][ci] = loc[2]; }
  return { cols: cut.cols, rows };
}

/* Выводы считаются по данным: критерий, который проседает везде, — вопрос к программе; один выбивающийся разрез — адресный. */
function heatInsights(H) {
  const out = [];
  const everywhere = H.rows.find(([n, v]) => Math.max(...v) < 60);
  if (everywhere) out.push(['al-warn', 'Стоит проверить программу обучения', `«${esc(everywhere[0])}» проседает во всех разрезах — от ${Math.min(...everywhere[1])}% до ${Math.max(...everywhere[1])}%. Когда критерий проседает везде, причина скорее в программе обучения, чем в отдельных подразделениях.`]);
  let best = null;
  H.rows.forEach(([n, v]) => {
    const sum = v.reduce((a, b) => a + b, 0);
    v.forEach((x, i) => { const d = Math.round((sum - x) / (v.length - 1) - x); if (d >= 12 && (!best || d > best.d)) best = { n, col: H.cols[i], d }; });
  });
  if (best) out.push(['al-accent', 'Стоит проверить условия на месте', `«${esc(best.n)}» в разрезе «${esc(best.col)}» на ${best.d} ${plural(best.d,['пункт','пункта','пунктов'])} ниже остальных, а по прочим критериям всё в норме. Лучше разобраться на месте, чем менять программу.`]);
  return out;
}

/* Выполнение по стандартам — по компании: результаты всех листов, которые проверяют один и тот же стандарт */
const COMP_TREND = [
  ['Организация работ на участке', 'Управление объектом', 66, 3, 1.8],
  ['Безопасная работа с электроустановками', 'Охрана труда', 74, 4, 1.6],
  ['Монтаж кабельных трасс', 'Монтаж', 78, -1, 1.4],
  ['Работа на высоте', 'Охрана труда', 85, 2, 1.3],
  ['Огневые работы', 'Охрана труда', 91, 0, 1.1]
];

function viewAnalytics() {
  const a = S.analytics, P = PERIODS[a.period];
  const tabs = [['criteria','Критерии'],['checks','Проведение проверок'],['comps','Компетенции']];
  const pSel = `<select class="sl" data-filter="period" aria-label="Период">${Object.entries(PERIODS).map(([k,v])=>opt(k,v.label,a.period)).join('')}</select>`;
  let body = '';

  if (a.tab === 'criteria') {
    const H = heatFor(a.tpl, a.cut), all = H.rows.flatMap(r => r[1]);
    const pct = clampN(Math.round(all.reduce((x, y) => x + y, 0) / all.length) + P.off, 0, 100);
    body = `<div class="fbar">${pSel}<select class="sl" data-filter="tpl" aria-label="Шаблон">${TEMPLATES.filter(x=>x.status==='published').map(x=>opt(x.id,x.name,a.tpl)).join('')}</select></div>
      <div class="col5" style="max-width:1120px">
        <div class="row wrap" style="gap:4px 12px;align-items:baseline"><b class="t3 tnum">${pct}%</b><span class="rg3 m2">выполнение компетенции · ${esc(P.d)}</span></div>
        <div class="cd">
          <div class="cd-h wrap"><div class="tx"><h3 class="t5">Выполнение критериев в разрезе</h3></div>
            <div class="sg s">${Object.entries(CUTS).map(([k,v])=>`<button class="${a.cut===k?'on':''}" type="button" data-cut="${k}">${v.label}</button>`).join('')}</div></div>
          <div style="overflow-x:auto" class="sc"><table class="heat"><thead><tr><th class="rh">Блок критериев</th>${H.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${H.rows.map(([n,vals])=>`<tr><th class="rh">${esc(n)}</th>${vals.map(v=>`<td class="${hc(v)}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <div class="heat-lg"><span><i style="background:#0EA658"></i>90% и выше</span><span><i style="background:#5BCF83"></i>70–89%</span><span><i style="background:#FFC46B"></i>60–69%</span><span><i style="background:#FF9F8F"></i>45–59%</span><span><i style="background:#FE725F"></i>ниже 45%</span></div>
        </div>
        ${heatInsights(H).map(([k, title, text]) => alertBox(k, title, text)).join('')}
      </div>`;
  } else if (a.tab === 'checks') {
    body = `<div class="fbar">${pSel}</div>
      <div class="col5" style="max-width:1120px">
        <div class="g3">
          <div class="kpi"><span class="v">${P.n}</span><span class="k">Сессий за период</span><span class="d" style="color:var(--warn-text)">${esc(P.plan)}</span></div>
          <div class="kpi"><span class="v">${P.none}</span><span class="k">Подразделений без единой сессии</span><span class="d" style="color:var(--neg)">проверки не проводятся</span></div>
          <div class="kpi"><span class="v">${P.ontime}</span><span class="k">Обратная связь дана в срок</span><span class="d m2">норматив — 24 часа</span></div>
        </div>
        <div class="g2">
          <div class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">План и факт</h3><p>Видно не где плохо, а где не проверяют вовсе.</p></div></div>
            <div class="col4">${[['БЦ «Северный»',212,220],['Штаб-квартира банка',180,240],['Офис ИТ-компании',96,120],['Башня «Восток»',64,110],['Субподрядчики',58,130]].map(([n,f,p])=>{const pc=Math.round(f/p*100);return `<div><div class="row" style="margin-bottom:6px"><span class="rg3">${esc(n)}</span><span class="sp"></span><span class="rg4 m2 tnum nowrap">${f} из ${p}</span><b class="sub2 tnum" style="width:44px;text-align:right">${pc}%</b></div>${pbar(pc)}</div>`;}).join('')}</div></div>
          <div class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">Качество заполнения</h3></div></div>
            <div class="col4">${[['Обратная связь короче минимума','18%','var(--warn-text)'],['Итог изменён вручную','4%','var(--text-2)'],['Критерий «не наблюдалось» чаще половины сессий','2 критерия','var(--neg)']].map(([k,v,c])=>`<div class="row top" style="gap:16px"><span class="rg3" style="flex:1">${k}</span><b class="sub1" style="color:${c};flex:none">${v}</b></div>`).join('')}
              <hr class="hr"><p class="rg4 m2">Последняя строка — сигнал о самой компетенции: критерий описывает редкую ситуацию или оторван от реальности.</p></div></div>
        </div>
      </div>`;
  } else {
    body = `<div class="col5" style="max-width:1120px"><div class="cd"><div class="cd-h"><div class="tx"><h3 class="t5">Какие компетенции проседают и растут — по компании</h3><p>Один лист проверяет одну компетенцию, но одну компетенцию могут проверять несколько листов. Здесь результаты сведены по компетенции: так видно, где акцентировать план обучения.</p></div></div>
      <div class="col4">${COMP_TREND.map(([name,group,pct,delta,att])=>`
        <div>
          <div class="trend-h">
            <span class="trend-n"><span class="rg3">${esc(name)}</span><span class="tg tg-gray sm">${esc(group)}</span></span>
            <span class="trend-r">
              <span class="rg4 m2 nowrap">${att.toFixed(1)} попытки до подтверждения</span>
              <b class="sub2 tnum nowrap" style="min-width:86px;text-align:right;color:${delta>0?'var(--pos-text)':delta<0?'var(--neg)':'var(--text-2)'}">${delta>0?'+':''}${delta||'±0'} · ${pct}%</b>
            </span>
          </div>${pbar(pct)}
        </div>`).join('')}</div></div></div>`;
  }

  return page({
    title:'Аналитика',
    sub: SECTION_SUB.analytics,
    actions:`<span class="tg tg-gray">Иллюстративные данные</span><button class="btn b-ghost" type="button" data-act="export">Выгрузить в Excel</button>`,
    tabs:`<div class="tabs">${tabs.map(([id,l])=>`<button class="tb-i ${a.tab===id?'on':''}" type="button" data-atab="${id}">${l}</button>`).join('')}</div>`,
    body
  });
}


</script>
<script>
'use strict';
/* ═══════════════ МОДАЛКИ ═══════════════ */
const subjectOptions = (cur) => EMPLOYEES.map(x => opt(x.id, x.name, cur)).join('');
const byOptions = (cur) => opt('auto', 'Руководитель по оргструктуре', cur) + EVALUATORS.map(e => opt(e.name, e.name, cur)).join('');
/* Кого оцениваем — чипы и выбор из списка: одной формой создаётся несколько сессий, по одной на каждого.
   Оценивающий один для всех; разных оценивающих по сотрудникам и по блокам листа задают отдельными ссылками */
const EACH_OPEN = 'Назначить по каждому сотруднику', EACH_CLOSE = 'Убрать назначение по сотрудникам';
const subjChip = (e, removable) => `<span class="chip on m-chip" data-subj-chip="${e.id}" title="${esc(e.role + ' · ' + e.unit)}">${esc(e.name)}${removable ? `<button class="x" type="button" data-act="subj-del" data-id="${e.id}" aria-label="Убрать: ${esc(e.name)}">${ic('close', 16)}</button>` : ''}</span>`;
const subjAddOptions = (chosen) => `<option value="">${chosen.length ? 'Добавить сотрудника…' : 'Выберите сотрудника…'}</option>` + EMPLOYEES.filter(e => !chosen.includes(e.id)).map(e => `<option value="${e.id}">${esc(e.name)} · ${esc(e.unit)}</option>`).join('');
const chosenSubjects = () => [...document.querySelectorAll('[data-subj-chip]')].map(c => c.dataset.subjChip);
const pairRows = () => {
  const main = document.getElementById('m-by').value, each = document.getElementById('m-by-each');
  return chosenSubjects().map(id => { const o = each && !each.hidden ? (each.querySelector(`[data-by-each="${id}"]`) || {}).value : ''; return { subj:id, byv:o || main }; });
};
const launchLabel = (later, n, isMove) => isMove ? 'Перенести'
  : later ? (n > 1 ? `Запланировать ${cnt(n, ['сессию','сессии','сессий'])}` : 'Запланировать')
  : (n > 1 ? `Создать ${cnt(n, ['сессию','сессии','сессий'])}` : `${ic16('bolt')} Начать заполнение`);
function refreshLaunch() {
  const btn = document.getElementById('m-launch'); if (!btn) return;
  const n = chosenSubjects().length, later = !!document.querySelector('[data-when="date"].on');
  btn.innerHTML = launchLabel(later, n, !!btn.dataset.id); btn.disabled = !n;
}
/* оценивающие по сотрудникам: список пересобирается при добавлении и удалении сотрудников, выбранное сохраняется */
function refreshByEach() {
  const btn = document.getElementById('m-by-each-btn'), box = document.getElementById('m-by-each'); if (!btn || !box) return;
  const ids = chosenSubjects(), keep = {};
  box.querySelectorAll('[data-by-each]').forEach(x => { keep[x.dataset.byEach] = x.value; });
  btn.hidden = ids.length < 2;
  if (ids.length < 2) { box.hidden = true; btn.textContent = EACH_OPEN; }
  box.innerHTML = `<div class="col" style="gap:8px;margin-top:10px">${ids.map((id, i) => { const e = EMPLOYEES.find(x => x.id === id); return `<div class="blk-ev"><span class="rg3 m2">${i + 1}</span><span class="blk-ev-t">${esc(e.name)}</span><select class="sl" data-by-each="${id}" aria-label="Оценивающий: ${esc(e.name)}">${opt('', 'Как выше', keep[id] || '')}${byOptions(keep[id] || '')}</select></div>`; }).join('')}</div>`;
}
function refreshSubjects() {
  const add = document.getElementById('m-subj-add'), ids = chosenSubjects();
  if (add) { add.innerHTML = subjAddOptions(ids); add.hidden = ids.length >= EMPLOYEES.length; }
  refreshByEach(); refreshLaunch();
}
/* «Дополнительно» в закрытом виде показывает текущее значение, чтобы не открывать без нужды */
const refreshMoreSummary = () => { const el = document.getElementById('m-more-sum'); if (!el) return; const sel = reportRecipients(); el.textContent = 'ссылка на отчёт: ' + (sel.length ? sel.map(k => REPORT_TO[k].to).join(', ') : 'никому'); };
/* ═══════════ ВЫБОР ЛИСТА С ПОИСКОМ ═══════════
   Форма запуска и форма правила: листов много, а выпадающий список не ищется. Значение лежит в скрытом поле #id —
   остальной код читает его как раньше. Панель с поиском раскрывается под полем и не перекрывает форму.
   Ищет по названию листа, стандарту и должности; стрелки и Enter работают, Esc закрывает панель. */
const tpkPool = () => TEMPLATES.filter(t => t.status === 'published');
const tpkSub = (t) => [stdName(t) ? 'компетенция: ' + stdName(t) : '', tplProfiles(t).join(', ')].filter(Boolean).join(' · ');
const tpkCur = (t, same) => t
  ? `<span class="nm">${esc(t.name)}</span><span class="mt">${esc(tpkSub(t))}</span>`
  : `<span class="nm ${same ? '' : 'm2'}">${same ? 'Тот же, что в сессии, которая провалилась' : 'Выберите лист'}</span>`;
function tplPicker(id, cur, same) {
  return `<div class="tpk" data-tpk="${id}" data-same="${same ? 1 : ''}">
    <input type="hidden" id="${id}" value="${esc(cur || '')}">
    <button class="tpk-btn" type="button" data-act="tpk-toggle" aria-haspopup="listbox" aria-expanded="false"><span class="tpk-cur">${tpkCur(cur ? tplById(cur) : null, same)}</span><span class="chev">${ic('chev', 16)}</span></button>
    <div class="tpk-panel" hidden></div>
  </div>`;
}
function tpkRefresh(box) {
  const input = box.querySelector('[data-tpk-q]'), toks = stdTokens(input ? input.value : ''), cur = box.querySelector('input[type=hidden]').value;
  const nameHit = (t) => toks.every(x => t.name.toLowerCase().includes(x)) ? 1 : 0;
  const list = tpkPool().filter(t => {
    if (!toks.length) return true;
    const hay = [t.name, stdName(t), tplProfiles(t).join(' ')].join(' ').toLowerCase();
    return toks.every(x => hay.includes(x));
  }).sort((a, b) => nameHit(b) - nameHit(a));
  const row = (id, name, sub, tags) => `<button class="tpk-row ${cur === id ? 'on' : ''}" type="button" role="option" aria-selected="${cur === id}" data-act="tpk-pick" data-id="${id}"><span class="nm"><span>${name}</span>${tags || ''}</span><span class="mt">${sub}</span></button>`;
  let html = box.dataset.same && !toks.length ? row('', 'Тот же, что в сессии, которая провалилась', 'Реагирует на провал любого листа') : '';
  html += list.map(t => row(t.id, hl(t.name, toks), hl(tpkSub(t), toks), '')).join('');
  box.querySelector('.tpk-list').innerHTML = html || '<div class="tpk-empty">Лист не найден. Проверьте название или компетенцию: новые листы создают в разделе «Шаблоны».</div>';
  if (toks.length) { const first = box.querySelector('.tpk-row'); if (first) first.classList.add('act'); }
}
function tpkClose(box) {
  const p = box.querySelector('.tpk-panel'); p.hidden = true; p.innerHTML = '';
  box.classList.remove('open'); box.querySelector('.tpk-btn').setAttribute('aria-expanded', 'false');
}
function closeOpenTpk(except) {
  let any = false;
  document.querySelectorAll('.tpk.open').forEach(b => { if (b !== except) { tpkClose(b); any = true; } });
  return any;
}
function tpkOpen(box) {
  closeOpenTpk(box);
  /* поле поиска создаём при открытии: закрытая панель не должна перехватывать автофокус окна */
  const p = box.querySelector('.tpk-panel');
  p.innerHTML = `<div class="tpk-search">${ic16('search')}<input class="in" type="search" data-tpk-q placeholder="Название листа, компетенция или должность" autocomplete="off" aria-label="Поиск листа"></div><div class="tpk-list sc" role="listbox"></div>`;
  p.hidden = false; box.classList.add('open'); box.querySelector('.tpk-btn').setAttribute('aria-expanded', 'true');
  tpkRefresh(box);
  box.querySelector('[data-tpk-q]').focus();
  const on = box.querySelector('.tpk-row.on'); if (on) on.scrollIntoView({ block:'nearest' });
}
function tpkKey(e, input) {
  const box = input.closest('.tpk'), rows = [...box.querySelectorAll('.tpk-row')];
  let i = rows.findIndex(r => r.classList.contains('act'));
  e.preventDefault();
  if (e.key === 'Enter') { const r = i >= 0 ? rows[i] : rows[0]; if (r) tpkPick(r); return; }
  if (!rows.length) return;
  if (i >= 0) rows[i].classList.remove('act');
  i = e.key === 'ArrowDown' ? (i + 1) % rows.length : (i <= 0 ? rows.length - 1 : i - 1);
  rows[i].classList.add('act'); rows[i].scrollIntoView({ block:'nearest' });
}
function tpkPick(row) {
  const box = row.closest('.tpk'), id = row.dataset.id, t = id ? tplById(id) : null;
  box.querySelector('input[type=hidden]').value = id;
  box.querySelector('.tpk-cur').innerHTML = tpkCur(t, !!box.dataset.same);
  tpkClose(box); box.querySelector('.tpk-btn').focus();
  if (box.dataset.tpk === 'm-tpl') onLaunchTpl(id);
}
/* смена листа в форме запуска: список блоков для назначения оценивающих — у нового листа */
function onLaunchTpl(id) {
  const t = tplById(id); if (!t) return;
  const bx = document.getElementById('m-blk-ev'), row = document.getElementById('m-blk-ev-row');
  if (bx) bx.innerHTML = blockEvRows(t);
  if (row) { row.hidden = t.blocks.length < 2; if (row.hidden) { row.querySelector('.sw').setAttribute('aria-checked', 'false'); bx.hidden = true; } }
}

/* Окно запуска: четыре решения — лист, кого оцениваем, кто оценивает, когда. Остальное свёрнуто или вынесено ссылками */
function modalSession(mode, preset) {
  preset = preset || {};
  const isMove = !!preset.id, later = mode === 'plan' || isMove;
  const tpls = TEMPLATES.filter(t => t.status === 'published');
  const tplId = preset.tpl || tpls[0].id, t = tplById(tplId);
  const byDef = preset.by || (later ? 'auto' : ME);
  const chosen = preset.subjectId ? [preset.subjectId] : [];
  const launchBtn = `<button class="btn b-neutral" type="button" id="m-launch" data-act="do-launch" data-id="${preset.id||''}">${launchLabel(later, chosen.length, isMove)}</button>`;
  modalShell(isMove ? 'Перенести сессию' : 'Запустить сессию', `
    <div class="fl"><label>Шаблон листа <span class="req">*</span></label>${tplPicker('m-tpl', tplId)}</div>
    <div class="fl"><label>Кого оцениваем <span class="req">*</span></label>
      <div class="row wrap" id="m-subj" style="gap:6px">${chosen.map(id => subjChip(EMPLOYEES.find(x => x.id === id), !isMove)).join('')}${isMove ? '' : `<select class="sl m-subj-add" id="m-subj-add" aria-label="Добавить сотрудника">${subjAddOptions(chosen)}</select>`}</div></div>
    <div class="fl"><label>Кто оценивает <span class="req">*</span></label>
      <select class="sl" id="m-by" aria-label="Кто оценивает">${byOptions(byDef)}</select>
      ${isMove ? '' : `<div class="swrow" id="m-blk-ev-row" style="padding:2px 0 0" ${t.blocks.length > 1 ? '' : 'hidden'}><div class="tx"><b>Несколько оценивающих</b></div><button class="sw" type="button" role="switch" aria-checked="false" aria-label="Несколько оценивающих" data-blk-ev-sw></button></div>
      <div id="m-blk-ev" hidden>${blockEvRows(t)}</div>
      <div class="row wrap"><button class="btn b-atert xs" type="button" id="m-by-each-btn" data-act="by-each" hidden>${EACH_OPEN}</button></div><div id="m-by-each" hidden></div>`}</div>
    <div class="fl"><label>Когда</label>
      <div class="sg"><button class="${later?'':'on'}" type="button" data-when="now">Сейчас</button><button class="${later?'on':''}" type="button" data-when="date">Запланировать</button></div></div>
    <div id="m-when-date" ${later?'':'hidden'}>
      <div class="g2">
        <div class="fl"><label>Дата и время начала <span class="req">*</span></label><input class="in" id="m-date" value="${esc(preset.date || '2 октября, 10:00')}"></div>
        <div class="fl"><label>Длительность наблюдения</label><select class="sl" id="m-dur">${['30 мин','45 мин','1 ч','2 ч','3 ч'].map(d=>opt(d,d,preset.dur||'1 ч')).join('')}</select></div></div>
    </div>
    ${isMove ? '' : `<details class="m-more"><summary><b>Дополнительно</b><span class="m-more-s" id="m-more-sum">ссылка на отчёт: оцениваемому, руководителю оцениваемого</span></summary>
      <div class="fl" style="margin-top:12px"><label>Кому отправить ссылку на отчёт ${infoDot('Ссылка уйдёт после завершения сессии')}</label>${reportChips()}</div></details>`}`,
    isMove ? `<button class="btn b-gray2" type="button" data-close="1">Отмена</button><span class="sp"></span>${launchBtn}`
           : `<button class="btn b-atert xs" type="button" data-act="launch-rule">Автозапуск по правилу →</button><span class="sp"></span><button class="btn b-gray2" type="button" data-close="1">Отмена</button>${launchBtn}`);
  refreshSubjects(); refreshMoreSummary();
}
/* ═══════════ ВЫБОР СТАНДАРТА ═══════════
   Лист создаётся от стандарта, поэтому выбор — отдельное окно, а не выпадающий список из двух десятков навыков:
   поиск по названию, фильтры по направлению и должности, «только без листа» (где стандарт ещё не покрыт).
   Не нашли — добавить новый: навык уходит в справочник, рабочая операция остаётся у листа. */
const stdTokens = (q) => q.toLowerCase().split(/\s+/).filter(Boolean);
function hl(text, toks) {
  if (!toks.length) return esc(text);
  const re = new RegExp('(' + toks.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}
/* окно перерисовывается при смене вида (список ↔ новый стандарт); возврат фокуса — на кнопку, с которой всё началось */
function stdModal(title, body, foot, cls) {
  const rf = S._returnFocus;
  modalShell(title, body, foot, cls);
  if (rf) S._returnFocus = rf;
}
function openStd(ctx, tplId) {
  const t = tplId ? tplById(tplId) : null;
  const std = ctx === 'new' ? (S.newTpl && S.newTpl.std) : (t && t.std);
  const cur = std && std.kind === 'skill' ? std.id : '';
  /* должность листа подставляем в фильтр, только если она одна: иначе фильтр спрятал бы нужное */
  S.std = { ctx, tplId: tplId || '', q:'', group:'', role: t && t.roles.length === 1 ? t.roles[0] : '', free:false,
            sel:cur, cur, curOp: std && std.kind === 'op' ? std.name : '', nw:null };
  modalStd();
}
function stdFiltered(noFilters) {
  const f = S.std, toks = stdTokens(f.q);
  return COMPETENCIES.filter(k => {
    if (!noFilters) {
      if (f.group && k.group !== f.group) return false;
      if (f.role && k.roles.length && !k.roles.includes(f.role)) return false;
      if (f.free && stdSheets(k.id, f.tplId).length) return false;
    }
    if (toks.length) { const hay = (k.name + ' ' + k.group + ' ' + k.roles.join(' ')).toLowerCase(); if (!toks.every(x => hay.includes(x))) return false; }
    return true;
  }).sort((a, b) => COMP_GROUPS.indexOf(a.group) - COMP_GROUPS.indexOf(b.group));
}
function stdRow(k, toks) {
  const f = S.std, on = f.sel === k.id, sh = stdSheets(k.id, f.tplId);
  const nums = k.indicators || k.courses ? `${cnt(k.indicators, ['индикатор','индикатора','индикаторов'])} · ${cnt(k.courses, ['курс','курса','курсов'])}` : 'индикаторов и курсов пока нет';
  const roles = k.roles.length > 3 && !toks.length ? k.roles.slice(0, 2).join(', ') + ' и ещё ' + (k.roles.length - 2) : k.roles.join(', ');

    ? 'листы: ' + sh.slice(0, 2).map(x => '«' + esc(x.name) + '»' + (x.status === 'archived' ? ' (архив)' : '')).join(', ') + (sh.length > 2 ? ' и ещё ' + (sh.length - 2) : '')

      <span class="mt">${hl(k.group, toks)} · ${k.roles.length ? 'для: ' + hl(roles, toks) : 'для всех должностей'}</span>

}
function stdListHtml(list) {

      <div class="acts">${fl ? '<button class="btn b-ghost s" type="button" data-act="std-reset" data-what="filters">Сбросить фильтры</button>' : q ? '<button class="btn b-ghost s" type="button" data-act="std-reset" data-what="q">Очистить поиск</button>' : ''}<button class="btn b-neutral s" type="button" data-act="std-new">${ic16('plus')} Добавить ${q ? '«' + esc(q) + '»' : 'новую компетенцию'}</button></div></div>`;

function stdCountHtml(n) {

function modalPublish(t) {
  const rep = t.status === 'published', n = tplCriteria(t).length, warn = [];

  if (!n) warn.push('В шаблоне нет ни одного критерия.');
  if (t.pass == null && t.verdictMode !== 'manual') warn.push('Проходной балл не задан — сессия покажет результат, но не предложит итог.');
  if (emptyCrit) warn.push('Есть критерии без формулировки — их нужно дописать до публикации.');
  const si = stdInfo(t.std), noStd = !si;
  if (noStd) warn.push('Не выбрана компетенция. Лист проверяет одну компетенцию: навык из библиотеки или рабочую операцию.');
  modalShell(rep ? 'Создать новую версию' : 'Опубликовать шаблон', `
    ${rep ? alertBox('al-accent','Почему новая версия, а не правка на месте', `У шаблона ${cnt(sessionsFor(t.id),['проведённая сессия','проведённые сессии','проведённых сессий'])}. Они останутся на версии ${t.version}, новые сессии пойдут по версии ${t.version+1} — так сравнение «до и после» остаётся корректным.`)
         : alertBox('al-pos','После публикации', 'Шаблон можно будет выбрать при запуске сессии и в правилах автозапуска. Версия фиксируется у каждой сессии в момент старта.')}
    ${kvList([['Блоков', t.blocks.length],['Критериев', n],['Критичных', tplCriteria(t).filter(c=>c.critical).length],['Компетенция', si ? esc(si.name) : 'не выбрана'],[t.verdictMode === 'manual' ? 'Итог' : 'Проходной балл', t.verdictMode === 'manual' ? 'решает оценивающий' : (t.pass!=null?t.pass+'%':'не задан')],['Полей обратной связи', t.feedback.length]])}
    ${warn.map(w => alertBox('al-warn','', w)).join('')}

}
/* ═══════════ ПРАВИЛО АВТОЗАПУСКА ═══════════
