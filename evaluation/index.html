document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.id === 'ovl') { closeModal(); return; }
  if (t.closest('[data-close]')) { closeModal(); return; }
  if (!t.closest('.tpk')) closeOpenTpk();
  const menuBtn = t.closest('[data-menu]');
  if (menuBtn) { S.menu = S.menu === menuBtn.dataset.menu ? null : menuBtn.dataset.menu; rerender(); return; }
  if (S.menu && !t.closest('.menu')) { S.menu = null; rerender(); }

  const nav = t.closest('[data-nav]'); if (nav) { go(nav.dataset.nav); return; }
  const other = t.closest('[data-other]'); if (other) { toast(`Переход: ${other.dataset.other}`); return; }

  const ttab = t.closest('[data-ttab]'); if (ttab) { S.templates.tab = ttab.dataset.ttab; rerender(); return; }
  const stab = t.closest('[data-stab]'); if (stab) { S.sessions.tab = stab.dataset.stab; rerender(); return; }
  const atab = t.closest('[data-atab]'); if (atab) { S.analytics.tab = atab.dataset.atab; rerender(); return; }
  const btab = t.closest('[data-btab]'); if (btab) { S.builder.tab = btab.dataset.btab; S.builder.pvi = null; rerender(); return; }
  const dvc = t.closest('[data-device]'); if (dvc) { S.builder.device = dvc.dataset.device; rerender(); return; }
  const pv = t.closest('[data-preview]'); if (pv) { S.builder.preview = pv.dataset.preview; rerender(); return; }
  const pvt = t.closest('[data-preview-tpl]'); if (pvt) { S.builder = { tab:'preview', selected:null, preview:pvt.dataset.previewMode||'employee', collapsed:{} }; go('builder', pvt.dataset.previewTpl); return; }
  const cut = t.closest('[data-cut]'); if (cut) { S.analytics.cut = cut.dataset.cut; rerender(); return; }
  const when = t.closest('[data-when]'); if (when) { when.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === when)); document.getElementById('m-when-date').hidden = when.dataset.when !== 'date'; refreshLaunch(); return; }
  const ft = t.closest('[data-filter-toggle]'); if (ft) { S.sessions[ft.dataset.filterToggle] = !S.sessions[ft.dataset.filterToggle]; rerender(); return; }
  const vmode = t.closest('[data-verdict-mode]'); if (vmode && !vmode.disabled) { currentTpl().verdictMode = vmode.dataset.verdictMode; rerender(); return; }
  const fr = t.closest('[data-filter-reset]');
  if (fr) {
    const k = fr.dataset.filterReset;
    if (k === 'sessions') S.sessions = { tab:S.sessions.tab, q:'', tpl:'', mine:false, src:'', rule:'' };
    else if (k === 'templates') S.templates = { tab:S.templates.tab, q:'', dir:'', profile:'' };
    else if (k === 'rules') S.rules = { q:'', tpl:'' };
    rerender(); return;
  }

  const sess = t.closest('[data-session]'); if (sess) { go('session', sess.dataset.session); return; }
  const fill = t.closest('[data-fill]'); if (fill) { const s = SESSIONS.find(x=>x.id===fill.dataset.fill); if (s && s.status!=='done') s.status = 'draft'; go('fill', fill.dataset.fill); return; }
  const gs = t.closest('[data-goto-sessions]'); if (gs) { S.sessions = { tab:'all', q:'', tpl:'', mine:false, src:'', rule:gs.dataset.gotoSessions }; go('sessions'); return; }
  const tplEl = t.closest('[data-tpl]'); if (tplEl) { S.builder = { tab:'structure', selected:null, preview:'fill', collapsed:collapsedFor(tplEl.dataset.tpl) }; go('builder', tplEl.dataset.tpl); return; }
  const ruleEl = t.closest('[data-rule]'); if (ruleEl && !t.closest('[data-rule-toggle]')) { const r = RULES.find(x=>x.id===ruleEl.dataset.rule); if (r) { if (S.route !== 'rules') go('rules'); modalRule(r); } return; }
  const rt = t.closest('[data-rule-toggle]'); if (rt) { const r = RULES.find(x=>x.id===rt.dataset.ruleToggle); r.enabled = !r.enabled; toast(r.enabled ? 'Правило включено' : 'Правило выключено — новые сессии создаваться не будут'); rerender(); return; }
  const so = t.closest('[data-scale-open]'); if (so && !t.closest('input,select,textarea,.sw,.ib,.btn:not([data-scale-open])')) { S.scales.open = S.scales.open === so.dataset.scaleOpen ? null : so.dataset.scaleOpen; rerender(); return; }
  const rc = t.closest('[data-rd-chip]');
  if (rc) { const arr = S.rd.conds[rc.dataset.rdChip], v = rc.dataset.v, i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); rc.classList.toggle('on', i < 0); rc.setAttribute('aria-pressed', String(i < 0)); return; }
  const rpc = t.closest('[data-report-chip]');
  if (rpc) { const on = !rpc.classList.contains('on'); rpc.classList.toggle('on', on); rpc.setAttribute('aria-pressed', String(on)); refreshMoreSummary(); return; }
  const rr = t.closest('[data-rd-repeat]');
  if (rr) { S.rd.every = rr.dataset.rdRepeat === 'every' ? (S.rd.every || 0) : null; document.getElementById('rs-rep').innerHTML = ruleRepeatHtml(); return; }
  const jump = t.closest('[data-jump]'); if (jump) { e.preventDefault(); const el = document.getElementById(jump.dataset.jump); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); return; }

  const crit = t.closest('[data-crit]');
  if (crit && t.closest('.cr-in')) { if (S.builder.selected !== crit.dataset.crit && !window.matchMedia('(max-width:900px)').matches) selectCrit(crit.dataset.crit); return; }
  if (crit && !t.closest('.acts, .grip')) { S.builder.selected = S.builder.selected === crit.dataset.crit ? null : crit.dataset.crit; rerender(); return; }

  const ans = t.closest('[data-ans]');
  if (ans) { const s = SESSIONS.find(x=>x.id===S.arg); if (s) { s.answers[ans.dataset.ans] = Number(ans.dataset.vi); rerender(); } return; }
  const po = t.closest('[data-prevopt]');
  if (po) { document.querySelectorAll('#prev-opts .opt-row').forEach(b => { b.classList.toggle('on', b === po); b.querySelector('.rd').setAttribute('aria-checked', String(b === po)); }); return; }

  /* переключатели с привязкой к модели */
  const sw = t.closest('.sw');
  if (sw) {
    if (sw.disabled) return;
    const on = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', String(on));
    if (sw.dataset.blkEvSw != null) { const bx = document.getElementById('m-blk-ev'); if (bx) bx.hidden = !on; return; }
    if (sw.dataset.scaleDefault) {
      const sd = scaleById(sw.dataset.scaleDefault);
      if (!on) { toast('Одна шкала должна оставаться по умолчанию: отметьте другую'); rerender(); return; }
      SCALES.forEach(x => { x.isDefault = false; }); sd.isDefault = true;
      toast(`«${sd.name}» — шкала по умолчанию для новых листов`); rerender(); return;
    }
    const tpl = currentTpl();
    if (sw.dataset.critSwitch) { const f = findCrit(tpl, S.builder.selected); if (f) { f.c[sw.dataset.critSwitch] = on; rerender(); } return; }
    if (sw.dataset.tplSwitch) { tpl[sw.dataset.tplSwitch] = on; rerender(); return; }
    if (sw.dataset.generalSwitch != null) { tpl.general[Number(sw.dataset.generalSwitch)].required = on; return; }
    if (sw.dataset.feedbackSwitch != null) { tpl.feedback[Number(sw.dataset.feedbackSwitch)].required = on; return; }
    if (sw.dataset.valueExcl) { const v = scaleById(sw.dataset.valueExcl).values[Number(sw.dataset.idx)]; v.excluded = on; if (on) v.score = null; else if (v.score == null) v.score = 0; rerender(); return; }
    return;
  }

  const a = t.closest('[data-act]');
  if (a && act[a.dataset.act]) { act[a.dataset.act](a); }
});

/* поля ввода: фильтры, конструктор, шкалы, правила — без перерисовки на каждый символ */
document.addEventListener('input', (e) => {
  const el = e.target; const tpl = tplById(S.arg);
  if (el.dataset.stdQ !== undefined) { S.std.q = el.value; refreshStd(); return; }
  if (el.dataset.tpkQ !== undefined) { tpkRefresh(el.closest('.tpk')); return; }
  if (el.dataset.rdField) { rdSet(el.dataset.rdField, el.value === '' ? 0 : Math.max(0, Number(el.value))); return; }
  if (el.dataset.filter) {
    const key = el.dataset.filter, bucket = S[S.route === 'builder' ? 'templates' : S.route] || S.sessions;
    bucket[key] = el.value;
    if (el.type === 'search') { clearTimeout(S._deb); S._deb = setTimeout(() => { const pos = el.selectionStart; rerender(); const n = document.querySelector(`[data-filter="${key}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch(_){} } }, 220); }
    else rerender();
    return;
  }
  if (!tpl) {
    if (el.dataset.scaleField) { scaleById(el.dataset.id)[el.dataset.scaleField] = el.value; if (el.dataset.scaleField === 'name') { const h = el.closest('.sc-card').querySelector('.sc-head .sub1'); if (h) h.textContent = el.value; } return; }
    if (el.dataset.valueField) { const v = scaleById(el.dataset.id).values[Number(el.dataset.idx)]; v[el.dataset.valueField] = el.dataset.valueField === 'score' ? (el.value === '' ? null : Number(el.value)) : el.value; return; }
    if (el.id === 'r-rx-add') return;
    /* заполнение сессии (viewFill): S.arg тут — id сессии, а не шаблона, поэтому tplById(S.arg) выше пуст */
    const fs = SESSIONS.find(x => x.id === S.arg);
    if (fs) {
      if (el.dataset.comment != null) { fs.comments = fs.comments || {}; fs.comments[el.dataset.comment] = el.value; return; }
      if (el.dataset.general != null) { fs.general[el.dataset.general] = el.value; return; }
      if (el.dataset.feedback != null) {
        if (el.dataset.feedbackPart != null) {
          const arr = Array.isArray(fs.feedback[el.dataset.feedback]) ? fs.feedback[el.dataset.feedback] : ['', '', ''];
          arr[Number(el.dataset.feedbackPart)] = el.value; fs.feedback[el.dataset.feedback] = arr;
        } else fs.feedback[el.dataset.feedback] = el.value;
        return;
      }
    }
    return;
  }
  if (el.dataset.tplName) { tpl.name = el.value; if (el.parentElement) el.parentElement.dataset.v = el.value; return; }
  if (el.dataset.blockName) { const b = tpl.blocks.find(x=>x.id===el.dataset.blockName); if (b) b.name = el.value; return; }
  if (el.dataset.critText !== undefined) {
    if (/\n/.test(el.value)) el.value = el.value.replace(/\s*\n\s*/g, ' ');
    const f = findCrit(tpl, el.dataset.critText); if (f) f.c.text = el.value;
    crFit(el); return;
  }
  if (el.dataset.critField) {
    const f = findCrit(tpl, S.builder.selected); if (!f) return;
    if (el.tagName === 'SELECT') return;
    f.c[el.dataset.critField] = el.value;
    return;
  }
  if (el.dataset.tplField && el.tagName !== 'SELECT') { const k = el.dataset.tplField; tpl[k] = k === 'pass' ? (el.value === '' ? null : Number(el.value)) : el.value; return; }
  if (el.dataset.generalField) { tpl.general[Number(el.dataset.idx)][el.dataset.generalField] = el.value; return; }
  if (el.dataset.feedbackField) { const f = tpl.feedback[Number(el.dataset.idx)]; f[el.dataset.feedbackField] = el.value; return; }
  if (el.dataset.scaleField) { scaleById(el.dataset.id)[el.dataset.scaleField] = el.value; return; }
  if (el.dataset.valueField) { const v = scaleById(el.dataset.id).values[Number(el.dataset.idx)]; v[el.dataset.valueField] = el.dataset.valueField === 'score' ? (el.value === '' ? null : Number(el.value)) : el.value; return; }
});
document.addEventListener('change', (e) => {
  const el = e.target; const tpl = tplById(S.arg);
  if (el.tagName !== 'SELECT') return;
  if (el.id === 'm-subj-add') { const e = EMPLOYEES.find(x => x.id === el.value); if (e) { el.insertAdjacentHTML('beforebegin', subjChip(e, true)); refreshSubjects(); } return; }
  if (el.dataset.rdField) { rdSet(el.dataset.rdField, el.value); if (el.dataset.rdRerender === 'by') document.getElementById('rs-by').innerHTML = ruleByHtml(); if (el.dataset.rdRerender === 'who') document.getElementById('rs-who').innerHTML = ruleWhoHtml(); return; }
  if (el.id === 'rd-cond-add') { if (!el.value) return; S.rd.conds[el.value] = condDefault(el.value); rdAfterConds(el.value); return; }
  if (el.dataset.stdGroup !== undefined) { S.std.group = el.value; refreshStd(); return; }
  if (el.dataset.stdRole !== undefined) { S.std.role = el.value; refreshStd(); return; }
  if (el.dataset.filter) { const bucket = S[S.route] || S.sessions; bucket[el.dataset.filter] = el.value; rerender(); return; }
  if (el.id === 'r-rx-add') { if (!el.value) return; const box = document.getElementById('r-rx'); if (box.querySelector('p')) box.innerHTML = ''; const n = box.querySelectorAll('[data-rx-idx]').length; box.insertAdjacentHTML('beforeend', `<div class="rx-edit"><input class="in" value="${esc(el.value)}" data-rx-idx="${n}" style="height:36px"><button class="ib s neg" type="button" data-act="rule-del-rx" data-idx="${n}">${ic('trash',16)}</button></div>`); el.value = ''; return; }
  if (el.dataset.general != null) { const fs = SESSIONS.find(x => x.id === S.arg); if (fs) fs.general[el.dataset.general] = el.value; return; }
  if (!tpl) return;
  if (el.dataset.critField) { const f = findCrit(tpl, S.builder.selected); if (f) { f.c[el.dataset.critField] = el.value; rerender(); } return; }
  if (el.dataset.tplField) {
    tpl[el.dataset.tplField] = el.value; rerender(); return;
  }
  if (el.dataset.generalField) { const gf = tpl.general[Number(el.dataset.idx)]; gf[el.dataset.generalField] = el.value; if (el.dataset.generalField === 'type') { if (gf.type === 'dict' && !gf.dict) gf.dict = DICT_NAMES[0]; rerender(); } return; }
});
/* поле формулировки в фокусе — критерий выбран, справа его настройки. На телефоне панель — шторка поверх списка, поэтому там выбирают касанием строки */
document.addEventListener('focusin', (e) => {
  const id = e.target.dataset && e.target.dataset.critText;
  if (id && S.builder.selected !== id && !window.matchMedia('(max-width:900px)').matches) selectCrit(id);
});
window.addEventListener('resize', () => document.querySelectorAll('textarea.cr-in').forEach(crFit));

/* ── перетаскивание критериев и блоков за ручку слева ──
   Критерий можно переносить внутри блока и между блоками (на пустой блок — в конец), блок — между блоками.
   Без мыши: на ручке стрелки вверх и вниз двигают элемент на шаг. */
let DRAG = null;
function dragTarget(e) {
  if (!DRAG) return null;
  const el = e.target.closest ? e.target : e.target.parentElement; if (!el) return null;
  if (DRAG.kind === 'value') {
    const vr = el.closest('.sc-row');
    if (vr && vr.dataset.scale === DRAG.id && vr.dataset.idx !== DRAG.idx) { const r = vr.getBoundingClientRect(); return { el:vr, kind:'vrow', idx:Number(vr.dataset.idx), pos: e.clientY < r.top + r.height / 2 ? 'before' : 'after' }; }
    return null;
  }
  if (DRAG.kind === 'crit') {
    const row = el.closest('.cr');
    if (row && row.dataset.crit !== DRAG.id) { const r = row.getBoundingClientRect(); return { el:row, kind:'row', id:row.dataset.crit, pos: e.clientY < r.top + r.height / 2 ? 'before' : 'after' }; }
    const blk = el.closest('.blk');
    if (blk && !row) return { el:blk, kind:'end', id:blk.dataset.blk };
    return null;
  }
  const blk = el.closest('.blk');
  if (blk && blk.dataset.blk !== DRAG.id) { const r = blk.getBoundingClientRect(); return { el:blk, kind:'block', id:blk.dataset.blk, pos: e.clientY < r.top + r.height / 2 ? 'before' : 'after' }; }
  return null;
}
function dragClear() { document.querySelectorAll('.drop-before,.drop-after,.drop-end').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-end')); }
document.addEventListener('dragstart', (e) => {
  const g = e.target.closest && e.target.closest('[data-grip]'); if (!g) return;
  DRAG = { kind:g.dataset.grip, id:g.dataset.id, idx:g.dataset.idx };
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG.id);
  const box = g.closest(DRAG.kind === 'crit' ? '.cr' : DRAG.kind === 'value' ? '.sc-row' : '.blk');
  if (box) { try { e.dataTransfer.setDragImage(box, 16, 16); } catch (_) {} setTimeout(() => box.classList.add('dragging'), 0); }
});
document.addEventListener('dragover', (e) => {
  const t = dragTarget(e); if (!t) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move'; dragClear();
  t.el.classList.add(t.kind === 'end' ? 'drop-end' : t.pos === 'before' ? 'drop-before' : 'drop-after');
});
document.addEventListener('drop', (e) => {
  const t = dragTarget(e); if (!t) return;
  e.preventDefault(); dragClear();
  if (DRAG.kind === 'value') {
    const sc = scaleById(DRAG.id), from = Number(DRAG.idx), [mv] = sc.values.splice(from, 1);
    let to = t.idx + (t.pos === 'after' ? 1 : 0); if (from < to) to--;
    sc.values.splice(to, 0, mv); DRAG = null; rerender(); return;
  }
  const tpl = currentTpl();
  if (DRAG.kind === 'crit') {
    const f = findCrit(tpl, DRAG.id); if (!f) return;
    f.b.criteria.splice(f.i, 1);
    if (t.kind === 'row') { const g = findCrit(tpl, t.id); g.b.criteria.splice(g.b.criteria.indexOf(g.c) + (t.pos === 'after' ? 1 : 0), 0, f.c); S.builder.collapsed[g.b.id] = false; }
    else { const b = tpl.blocks.find(x => x.id === t.id); b.criteria.push(f.c); S.builder.collapsed[b.id] = false; }
  } else {
    const i = tpl.blocks.findIndex(b => b.id === DRAG.id); if (i < 0) return;
    const [blk] = tpl.blocks.splice(i, 1), j = tpl.blocks.findIndex(b => b.id === t.id);
    tpl.blocks.splice(j + (t.pos === 'after' ? 1 : 0), 0, blk);
  }
  DRAG = null; rerender();
});
document.addEventListener('dragend', () => { dragClear(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); DRAG = null; });
document.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches('[data-grip]') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault(); const id = ae.dataset.id, kind = ae.dataset.grip;
    if (kind === 'value') { const i = Number(ae.dataset.idx), d = e.key === 'ArrowUp' ? -1 : 1; act['move-value']({ dataset:{ id, idx:String(i), dir:String(d) } }); const nx = document.querySelector(`[data-grip="value"][data-id="${id}"][data-idx="${Math.max(0, i + d)}"]`); if (nx) nx.focus(); return; }
    act[kind === 'crit' ? 'move-crit' : 'move-block']({ dataset:{ id, dir: e.key === 'ArrowUp' ? '-1' : '1' } });
    const again = document.querySelector(`[data-grip="${kind}"][data-id="${id}"]`); if (again) again.focus(); return;
  }
  if (e.key === 'Enter' && ae && ae.matches && ae.matches('.cr-in')) { e.preventDefault(); ae.blur(); return; }
  if (ae && ae.matches && ae.matches('[data-tpk-q]') && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) { tpkKey(e, ae); return; }
  if (e.key === 'Escape') {
    const open = document.querySelector('.tpk.open');
    if (open) { tpkClose(open); open.querySelector('.tpk-btn').focus(); return; }
    closeModal(); if (S.menu) { S.menu = null; rerender(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && ae && ae.matches && ae.matches('tr.clk')) { e.preventDefault(); ae.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.matches && document.activeElement.matches('[data-crit]')) { e.preventDefault(); const id = document.activeElement.dataset.crit; S.builder.selected = S.builder.selected === id ? null : id; rerender(); }
});

/* Встраивание в прототип Start: ?embed=1 прячет своё меню и шапку, раздел — из #hash */
(function () {
  if (new URLSearchParams(location.search).get('embed')) document.documentElement.classList.add('embed');
  const h = location.hash.slice(1);
  if (NAV.some(n => n.id === h)) S.route = h;
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (NAV.some(n => n.id === r)) go(r); });
})();
renderNav(); render();

</script>
